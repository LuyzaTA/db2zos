      {q:"How do Db2 for z/OS buffer pools differ structurally from Db2 LUW bufferpools?", options:["They don't differ at all","z/OS buffer pools are subsystem-level and shared across databases, not per-database","z/OS has no concept of buffer pools","z/OS buffer pools are always exactly 4K"], answer:1, explain:"z/OS buffer pools are configured at the subsystem level and can be shared across many databases/table spaces."},

COURSE.modules.push({
  id:"m14", num:"14", title:"Db2 Logging and Recovery", level:"core",
  blurb:"Active/archive logs, BSDS, checkpoints, COPY/RECOVER, point-in-time recovery, and restart recovery.",
  lessons:[ L({
    id:"m14-l1", title:"Logging, BSDS, and the Recovery Model",
    why:"Recovery is the single highest-stakes DBA skill on any platform. On z/OS the mechanics differ enough from LUW's backup/restore/rollforward model that guessing under pressure is dangerous — this module builds the correct mental model before Module 27's incident scenarios.",
    luw:{ know:"Active and archive logs per database; BACKUP DATABASE for full/incremental backups; RESTORE + ROLLFORWARD to recover to a point in time.",
          changes:"Db2 for z/OS also has active and archive logs, but they are shared across the whole subsystem (all databases in it), tracked via the BSDS (Bootstrap Data Set) — a small but critical dataset recording log inventory and checkpoint information. Backups are taken with the COPY utility (image copies, at table space/index level, not whole-database), and recovery is performed with the RECOVER utility, which restores an image copy and applies logs forward (and can also apply them to a specific point in time).",
          why:"Db2 for z/OS's logging is subsystem-wide because the engine's recovery/restart model was built around one coordinated log stream serving everything in the subsystem, ensuring restart consistency across all its databases together rather than per-database independence." },
    concept:`<p>Core components:</p>
      <ul>
        <li><strong>BSDS (Bootstrap Data Set)</strong> — a small, critical VSAM dataset (duplexed for safety) recording the active/archive log inventory, checkpoint queue, and other restart-critical control information. Db2 cannot start without a healthy BSDS.</li>
        <li><strong>Active logs</strong> — the current, actively-written log datasets; when full, Db2 offloads them to archive logs.</li>
        <li><strong>Archive logs</strong> — offloaded copies of filled active logs, retained per installation policy, needed for any recovery reaching further back than what's still in the active logs.</li>
        <li><strong>Checkpoints</strong> — periodic points recorded in the log/BSDS that bound how much log restart processing must replay after a subsystem failure.</li>
        <li><strong>COPY utility</strong> — takes image copies (full or incremental) of table spaces/indexes; the foundation for any later RECOVER.</li>
        <li><strong>RECOVER utility</strong> — restores the most applicable image copy and applies log records forward to the current point (or to a specified point in time / log point, for point-in-time recovery).</li>
        <li><strong>Restart recovery</strong> — after an unplanned subsystem outage, Db2 automatically uses the log and BSDS checkpoint information to restore consistency (in-flight units of work backed out, committed work ensured durable) before allowing new work — conceptually similar to LUW crash recovery on restart, but is a core, highly visible part of subsystem start-up here.</li>
      </ul>
      <div class="callout">Because logs are subsystem-wide, a single log or BSDS problem can affect every database in that subsystem — a very different blast radius than a single LUW database's log issue.</div>`,
    visual:`<div class="diagram"><div class="box-tree">Db2 subsystem
  ├─ BSDS (duplexed)  ── log inventory + checkpoint queue (subsystem restart depends on this)
  ├─ Active logs      ── current writes; offloaded to...
  └─ Archive logs      ── older log history

Recovery flow:
  COPY utility  ──►  image copy (table space / index level)
       +
  Archive/active logs  ──►  RECOVER utility applies logs forward
       =
  Table space restored to current, or to a specific point in time</div></div>`,
    example:"A table space becomes logically corrupted by a bad batch job at 14:30. The DBA identifies the most recent good image copy, then runs RECOVER TABLESPACE ... TORBA/TOLOGPOINT (or TOCOPY, depending on strategy) to restore to just before the bad job ran, applying only the necessary log records — directly analogous in intent to a LUW RESTORE + ROLLFORWARD TO a point in time, but executed as a single utility with explicit point-in-time targeting options.",
    handsOn:"Using the troubleshooting framework (Symptom → Scope → Evidence → Hypothesis → Test → Action → Validation → Root Cause), sketch your approach to: 'A table space is unavailable at 14:30. What information do you need, which utilities apply, and what recovery strategy would you propose?' Write down your reasoning before checking Module 27 for the full worked scenario.",
    trap:"Do not assume 'the archive logs are backed up somewhere else, like off-site object storage tooling' by default — archive log retention and offsite/duplex strategy is an explicit installation policy decision, and a DBA must know their shop's policy before promising a recovery point is achievable. Also: RECOVER operates at the table space/index level, not 'the whole database' — plan multi-object recovery accordingly.",
    remember:[
      "The BSDS is the subsystem's most critical small dataset — it tracks log inventory and checkpoints, and Db2 cannot start without it.",
      "Active and archive logs are shared across the whole subsystem, not per database.",
      "COPY takes image copies; RECOVER restores an image copy and applies logs forward (optionally to a point in time).",
      "RECOVER operates at table space/index granularity, not 'restore the whole database' the way LUW's model often feels.",
      "Restart recovery automatically reconciles in-flight work using the log/BSDS after any unplanned outage."
    ],
    check:[
      {q:"What does the BSDS track?", options:["SQL access paths","Log inventory and checkpoint information critical for subsystem restart","User passwords","Buffer pool hit ratios"], answer:1, explain:"The BSDS records the active/archive log inventory and checkpoint queue needed for restart and recovery."},
      {q:"At what granularity does the RECOVER utility typically operate?", options:["Whole subsystem only","Table space / index level","Whole LPAR","Single SQL statement"], answer:1, explain:"RECOVER operates on table spaces and indexes, not the whole database or subsystem as a single unit."},
      {q:"Which Db2 for z/OS utility is the closest analog to Db2 LUW's BACKUP DATABASE?", options:["RUNSTATS","COPY","REORG","CHECK DATA"], answer:1, explain:"COPY produces image copies, the z/OS analog to LUW's BACKUP, though at table space/index granularity rather than whole-database."}
    ],
    deep:`<p data-level="expert"><span class="levelmark expert">Expert</span> System-level backup/recovery (leveraging fast-replication technologies for full-subsystem or full-group consistency points) and remote/GDPS-based disaster recovery extend this model considerably — covered further in Modules 26-27. Log-based recovery concepts (RBA/LRSN, discussed in the Glossary) become essential vocabulary once you move into data sharing, since LRSN provides a sysplex-wide consistent log sequencing mechanism.</p>`,
    sources:[["IBM Documentation — Db2 for z/OS Backup and recovery","https://www.ibm.com/docs/en/db2-for-zos"]]
  })]
});

COURSE.modules.push({
  id:"m15", num:"15", title:"Db2 Utilities Reference Center", level:"core",
  blurb:"LOAD, UNLOAD, REORG, RUNSTATS, COPY, RECOVER, CHECK DATA/INDEX, MODIFY, REBUILD INDEX, REPAIR, CATMAINT.",
  lessons:[ L({
    id:"m15-l1", title:"The Utility Reference Center",
    why:"Utilities are how a Db2 for z/OS DBA does almost all physical administration — there is no single admin SQL console command for most of this work. Knowing each utility's purpose, JCL shape, and common failure modes is core, everyday DBA competency.",
    luw:null,
    concept:`<p>Every utility below runs under the same driver program pattern shown in Module 5 (PGM=DSNUTILB or an installation-standard PROC), with utility-specific control statements in SYSIN.</p>
      <div class="table-scroll"><table>
      <tr><th>Utility</th><th>Purpose</th><th>LUW equivalent</th><th>Production note</th></tr>
      <tr><td>LOAD</td><td>Bulk-load data into a table, optionally replacing existing data</td><td>LOAD / IMPORT</td><td>Can run online (LOAD ... RESUME) with concurrent access considerations; watch for index/constraint violations routed to a discard file.</td></tr>
      <tr><td>UNLOAD</td><td>Extract table data to a sequential dataset, often for reload or migration</td><td>EXPORT</td><td>Faster and more DBA-oriented than SELECT-based extraction for large volumes.</td></tr>
      <tr><td>REORG</td><td>Reorganizes table space/index physical storage — reclaims space, restores clustering</td><td>REORG TABLE</td><td>Online REORG (SHRLEVEL CHANGE) allows concurrent access via shadow datasets and log apply; understand claims/drains (Module 20) before running against hot objects.</td></tr>
      <tr><td>RUNSTATS</td><td>Collects statistics used by the optimizer</td><td>RUNSTATS</td><td>Stale statistics are a top cause of access path regressions — schedule consistently, especially after large LOAD/REORG.</td></tr>
      <tr><td>COPY</td><td>Produces image copies (full or incremental) for recovery</td><td>BACKUP DATABASE</td><td>Foundation for RECOVER; incremental copies reduce window but add RECOVER complexity/time.</td></tr>
      <tr><td>RECOVER</td><td>Restores from image copy(ies) and applies logs</td><td>RESTORE + ROLLFORWARD</td><td>Can target current, a point in time, or a specific copy; always verify the target before running against production.</td></tr>
      <tr><td>CHECK DATA</td><td>Validates referential integrity and check constraints</td><td>No exact equivalent — closest is manual constraint validation</td><td>Run after LOAD with constraints disabled, or after suspected corruption.</td></tr>
      <tr><td>CHECK INDEX</td><td>Validates index consistency against table data</td><td>No exact equivalent</td><td>Run when index corruption is suspected (e.g., after an abend during index maintenance).</td></tr>
      <tr><td>MODIFY</td><td>Removes old/obsolete records from SYSIBM utility history and image copy catalog entries</td><td>No direct equivalent (housekeeping)</td><td>Prevents catalog/directory bloat from utility execution history.</td></tr>
      <tr><td>REBUILD INDEX</td><td>Rebuilds an index from the table data</td><td>Similar in spirit to dropping/recreating an index, but utility-driven</td><td>Used after CHECK INDEX finds corruption, or after certain recovery scenarios.</td></tr>
      <tr><td>REPAIR</td><td>Directly repairs specific catalog/data inconsistencies (a precision tool, used carefully)</td><td>No safe direct equivalent</td><td>High-risk utility; used under controlled, deliberate circumstances, often with IBM support guidance.</td></tr>
      <tr><td>CATMAINT</td><td>Maintains/migrates catalog structure itself (used mainly during Db2 version migration)</td><td>No equivalent — catalog structure migration is a z/OS-specific concern</td><td>Normally run as part of a documented migration process, not routine operations.</td></tr>
      </table></div>
      <div class="terminal">//STEP1 EXEC PGM=DSNUTILB,PARM='DSN1,UTILITY'
//STEPLIB DD DSN=DSN1010.SDSNLOAD,DISP=SHR
//SYSPRINT DD SYSOUT=*
//SYSIN DD *
  REORG TABLESPACE PAYDB.PAYTS SHRLEVEL CHANGE
/*</div>`,
    visual:`<div class="diagram"><div class="box-tree">Data lifecycle across utilities
LOAD  ──►  RUNSTATS  ──►  COPY  ──►  (production access, monitored)
                                        │
                        REORG (periodic maintenance) ──► RUNSTATS ──► COPY
                                        │
                        CHECK DATA / CHECK INDEX (integrity verification)
                                        │
                        RECOVER (if something goes wrong)</div></div>`,
    example:"After a large monthly LOAD, a production runbook typically chains: LOAD → CHECK DATA (validate constraints if loaded with them disabled for speed) → RUNSTATS (refresh optimizer statistics) → COPY (establish a fresh recovery point) — a sequencing discipline directly analogous to a LUW load/validate/analyze/backup pipeline, just expressed as separate utility executions.",
    handsOn:"Write the utility sequence (just the utility names, in order) you'd run after discovering an index is corrupted following an abended batch job: CHECK INDEX (confirm) → REBUILD INDEX (repair) → RUNSTATS (refresh stats if needed) → COPY (re-establish recovery point).",
    trap:"Don't assume every utility can run fully online/concurrently by default. Many have SHRLEVEL options (REFERENCE/CHANGE/NONE) that materially change both concurrency behavior and elapsed time — always check what SHRLEVEL a runbook or your JCL actually specifies before assuming 'this won't block anything.'",
    remember:[
      "Utilities are the primary administration mechanism — there is no single 'admin console' replacing them.",
      "LOAD/UNLOAD, REORG, RUNSTATS, COPY, RECOVER map conceptually to familiar LUW operations.",
      "CHECK DATA/CHECK INDEX, MODIFY, REPAIR, and CATMAINT have no clean LUW equivalent — they're new tools for new problems.",
      "SHRLEVEL (REFERENCE/CHANGE/NONE) controls concurrency during utility execution — always verify it for hot objects.",
      "A standard post-load runbook is typically LOAD → CHECK DATA → RUNSTATS → COPY."
    ],
    check:[
      {q:"Which utility is the closest match to Db2 LUW's BACKUP DATABASE?", options:["RUNSTATS","COPY","LOAD","MODIFY"], answer:1, explain:"COPY produces image copies used as the basis for later RECOVER, analogous to LUW's BACKUP."},
      {q:"What does the REORG utility's SHRLEVEL CHANGE option enable?", options:["Faster CPU processing only","Concurrent read/write access during the reorganization via shadow datasets and log apply","Automatic index rebuilding","Disabling logging during REORG"], answer:1, explain:"SHRLEVEL CHANGE (online REORG) allows concurrent access while the reorg runs, using shadow datasets and log apply to catch up."},
      {q:"Which utility validates referential integrity and check constraints?", options:["CHECK DATA","MODIFY","CATMAINT","UNLOAD"], answer:0, explain:"CHECK DATA validates referential integrity and check constraints, commonly run after a LOAD with constraints disabled."}

    deep:`<p data-level="dba"><span class="levelmark dba">DBA</span> Return codes for utilities generally follow 0=success, 4=warning (e.g., some rows discarded), 8=error requiring investigation, and higher codes for more severe conditions — but exact meaning is utility-specific; always check the utility's own messages in SYSPRINT, not just the numeric RC.</p>`,

  blurb:"Not SQL from zero — the differences, compatibility traps, and z/OS-specific SQL features.",
  lessons:[ L({
    id:"m17-l1", title:"SQL Differences and Migration Traps",
    why:"Core SQL is portable, but enough differs — special registers, certain data type defaults, identity/sequence behavior, SQL PL specifics — that assuming full compatibility causes real migration bugs.",
    luw:{ know:"Full SQL:2016-ish feature set including window functions, CTEs, MERGE, sequences, identity columns, XML, temporal tables, and PL/SQL-compatible or native SQL PL routines.",
          changes:"Db2 for z/OS supports a very similar modern SQL feature set (window functions, CTEs, sequences, identity columns, XML, LOBs, temporal tables, SQL PL), but with platform-specific special registers, some differing defaults, and application connectivity patterns (heavy use of static SQL/embedded SQL in COBOL/PL/I) that are less central in typical LUW app development.",
          why:"Both platforms track the same SQL standard evolution, but Db2 for z/OS's feature adoption pace and defaults reflect its enterprise/transaction-processing heritage and its tighter coupling to precompiled host-language application patterns." },
    concept:`<p>Notable areas to double-check when moving SQL between platforms:</p>
      <ul>
        <li><strong>Special registers</strong> — CURRENT SQLID, CURRENT PACKAGESET, CURRENT SERVER and others carry z/OS-specific meaning tied to authorization and package resolution; don't assume 1:1 behavior with LUW special registers of similar names.</li>
        <li><strong>Data types</strong> — precision/scale defaults, DECFLOAT support timing, and certain implicit casting rules can differ subtly by version; verify against documentation for both source and target versions.</li>
        <li><strong>Identity columns and sequences</strong> — both exist and are conceptually similar, but caching, ordering guarantees under concurrency, and interaction with data sharing deserve verification for high-throughput designs.</li>
        <li><strong>Temporal tables (system-period, business-period)</strong> — supported on Db2 for z/OS; syntax and history-table mechanics are close to LUW's, but confirm version availability.</li>
        <li><strong>XML and LOB</strong> — supported with platform-specific storage implications (auxiliary table spaces, Module 12).</li>
        <li><strong>SQL PL / stored procedures</strong> — native SQL procedures are supported; external stored procedures commonly run in a WLM-managed SPAS (Module 8), which affects deployment and tuning in ways LUW's fenced-mode model doesn't map to exactly.</li>
        <li><strong>Static vs. dynamic SQL emphasis</strong> — production z/OS applications (COBOL/CICS/IMS/batch) very commonly use static, precompiled SQL bound into packages (Module 18) — an application pattern far less central to typical LUW development, where dynamic SQL via drivers/ORMs dominates.</li>
      </ul>`,

      "External stored procedures run in a WLM-managed SPAS — a different deployment/tuning model than LUW fenced mode.",

COURSE.modules.push({
  id:"m18", num:"18", title:"Packages, Collections, and Plans", level:"core",
  blurb:"The major conceptual gap for LUW DBAs: DBRM → BIND → package → collection → plan.",
  lessons:[ L({
    id:"m18-l1", title:"From Source Code to Execution: the Bind Model",
    why:"This is arguably the single biggest conceptual gap between the two platforms. Nothing in typical Db2 LUW administration maps cleanly onto packages/collections/plans — this deserves careful, patient study rather than force-fitting an analogy.",
    luw:{ know:"Dynamic SQL is prepared and cached in the package cache at execution time; explicit 'binding' isn't a routine everyday DBA concern for most application patterns.",
          changes:"Db2 for z/OS applications using static SQL go through an explicit compile-time step: SQL statements are extracted from host-language source (COBOL, PL/I, etc.) into a DBRM (Database Request Module), then BIND turns that into a PACKAGE (an executable, access-path-resolved form of the SQL), packages are grouped into COLLECTIONs, and collections are referenced by a PLAN, which is what a program actually connects with to execute.",
          why:"Static SQL's whole design point is to resolve access paths and authorization ahead of time, at bind time, so production transaction execution avoids the cost and access-path unpredictability of runtime SQL preparation — a deliberate optimization for very high-volume, latency-sensitive transaction workloads." },
    concept:`<p>The flow, end to end:</p>
      <div class="diagram"><div class="flow">
        <div class="box">Source code (COBOL/PL·I with embedded SQL)</div><div class="arrow">↓ precompile</div>
        <div class="box">DBRM (Database Request Module)</div><div class="arrow">↓ BIND</div>
        <div class="box">PACKAGE (access paths resolved for this DBRM)</div><div class="arrow">↓ grouped into</div>
        <div class="box">COLLECTION (a named group of packages)</div><div class="arrow">↓ referenced by</div>
        <div class="box">PLAN (what the application actually binds/connects to)</div><div class="arrow">↓</div>
        <div class="box">Execution</div>
      </div></div>
      <p>Definitions:</p>
      <ul>
        <li><strong>DBRM</strong> — the extracted SQL statements from one program's source, with host-variable references, before any access path is chosen.</li>
        <li><strong>BIND</strong> — the process that takes a DBRM (or, for packages, directly binds SQL into a package) and produces a package: SQL is parsed, authorization-checked, and an access path is chosen by the optimizer using current catalog statistics — this is where EXPLAIN-relevant decisions get made (Module 21).</li>
        <li><strong>PACKAGE</strong> — the bound, executable form of one program's SQL, versioned, and stored (its executable structure) largely in the directory, with metadata in the SYSIBM.SYSPACKAGE catalog table.</li>
        <li><strong>COLLECTION</strong> — a named grouping of packages, used for organization and for controlling which package version an application resolves to at runtime (e.g., separating collections per environment or application module).</li>
        <li><strong>PLAN</strong> — historically the top-level bindable object an application connected to; modern application design increasingly favors package lists / collections referenced dynamically (via a plan that just lists collections) over large monolithic plans, but the concept of 'the thing the app binds to, which resolves to a set of packages' remains central.</li>
        <li><strong>REBIND</strong> — re-runs bind for an existing package/plan (typically after RUNSTATS refresh or a Db2 version upgrade) to potentially pick a new access path from current statistics — one of the most consequential, routine DBA operations on this platform (Module 21 covers access-path regression risk).</li>
        <li><strong>Dynamic SQL</strong> is also fully supported and common in modern applications (including via DDF-connected clients) — it behaves more like the LUW dynamic SQL you already know, prepared and cached at execution time, though still subject to package/collection-based authorization concepts (e.g., via a package used to hold dynamic SQL's authorization context).</li>
      </ul>`,
    visual:`<div class="diagram"><div class="box-tree">Program source (COBOL/PL/I, embedded SQL)
   │ precompile
   ▼
DBRM ──────────────► BIND PACKAGE
                         │
                         ▼
                     PACKAGE (access path resolved, versioned)
                         │  member of
                         ▼
                     COLLECTION
                         │  referenced by
                         ▼
                       PLAN  ◄── application CONNECTs / binds here
                         │
                         ▼
                    Execution at runtime</div></div>`,
    example:"A payroll batch program's SQL is bound into a package during the nightly build pipeline. After a RUNSTATS refresh reveals a table has grown 10x, the DBA REBINDs the package so the optimizer can reconsider the access path against current statistics — analogous in spirit to LUW's dynamic SQL naturally re-optimizing against fresh stats, except here it requires an explicit REBIND step because the access path was chosen and frozen at bind time.",
    handsOn:"Trace, in order, what happens when a COBOL batch program with embedded SQL is built and deployed: write source → precompile (produces DBRM) → BIND PACKAGE (produces package, chooses access path) → package added to a collection → plan references the collection → program executes and resolves through the plan. Then explain in one sentence why a REBIND might be needed after a large data volume change.",
    trap:"The most damaging LUW-DBA assumption here is thinking of a 'package' as being like the package cache entry for a prepared dynamic statement. It is not ephemeral, and it is not automatically re-optimized as data changes — a static SQL package's access path stays frozen until an explicit REBIND (or an automatic rebind under specific conditions) happens. Forgetting this causes real production access-path regressions that silently persist for months.",
    remember:[
      "DBRM → BIND → PACKAGE → COLLECTION → PLAN is the static SQL execution chain — memorize this order.",
      "BIND is where the optimizer chooses (and freezes) an access path using current catalog statistics.",
      "REBIND re-evaluates the access path against current statistics — routine but consequential (Module 21).",
      "Dynamic SQL still exists and behaves closer to what you know from LUW, but static SQL is the dominant production pattern here.",
      "A package's access path does NOT automatically adapt as data changes — that's what makes REBIND discipline essential."
    ],
    check:[
      {q:"What is the correct order of the static SQL bind chain?", options:["PLAN → COLLECTION → PACKAGE → DBRM","DBRM → PACKAGE → COLLECTION → PLAN","PACKAGE → DBRM → PLAN → COLLECTION","COLLECTION → DBRM → PLAN → PACKAGE"], answer:1, explain:"Source is precompiled into a DBRM, bound into a package, packages are grouped into collections, and a plan references collections/is what the app connects to."},
      {q:"When is a static SQL package's access path chosen?", options:["Every time the statement executes, like dynamic SQL","At BIND time, using catalog statistics current at that moment, and it stays frozen until REBIND","Only when the DBA manually types the access path","Access paths don't apply to static SQL"], answer:1, explain:"BIND freezes the access path; it won't automatically change until an explicit REBIND (or specific automatic-rebind conditions)."},
      {q:"Why might a DBA REBIND a package after a large data volume change?", options:["To change the table's column definitions","So the optimizer can reconsider the access path using current statistics","To grant new privileges","REBIND has no relationship to data volume"], answer:1, explain:"REBIND lets the optimizer re-evaluate the access path against refreshed statistics, which matters greatly after major data changes."}
    ],
    deep:`<p data-level="dba"><span class="levelmark dba">DBA</span> Package versioning allows multiple bound versions of the same package to coexist, supporting phased application rollout/rollback strategies without breaking currently-executing work — verify current version-management syntax (VERSION clause on BIND) against your Db2 release's documentation.</p>`,
    sources:[["IBM Documentation — Db2 for z/OS Program preparation (precompile, bind)","https://www.ibm.com/docs/en/db2-for-zos"]]
  })]

  id:"m19", num:"19", title:"Application Connections and DDF", level:"core",
  blurb:"DDF, DRDA, distributed connections, and what a LUW DBA must unlearn about client/server architecture.",
  lessons:[ L({
    id:"m19-l1", title:"DDF: Db2 for z/OS as a Distributed Server",
    why:"Modern applications overwhelmingly connect to Db2 for z/OS remotely, through DDF — understanding this path is essential for both day-2 operations and performance troubleshooting (DDF thread accumulation is a classic incident, revisited in Module 32).",
    luw:{ know:"Direct TCP/IP client/server connections: a driver connects straight to the database engine's listener, largely symmetric regardless of client platform.",
          changes:"Remote connections to Db2 for z/OS go through DDF (Distributed Data Facility), running in its own address space (DIST, Module 8), using DRDA (Distributed Relational Database Architecture) as the wire protocol over TCP/IP. Distributed requests still resolve through the package/collection model (Module 18) for authorization and, often, execution — even purely 'dynamic SQL' JDBC/ODBC clients interact with DDF-managed package infrastructure under the covers.",
          why:"DRDA was designed as an open, standardized distributed database protocol (predating and influencing much of today's client/server database connectivity), and DDF's separate address space reflects the platform's pattern of isolating distinct workloads (Module 8) so distributed traffic can be independently monitored, throttled, and prioritized via WLM." },
    concept:`<p>Key building blocks:</p>
      <ul>
        <li><strong>DDF</strong> — the address space (DIST) that accepts remote DRDA connections over TCP/IP and routes work into the subsystem.</li>
        <li><strong>DRDA</strong> — the open distributed database protocol used; JDBC/ODBC/.NET drivers for Db2 for z/OS speak DRDA under the hood.</li>
        <li><strong>Packages for dynamic SQL</strong> — DDF-driven applications' dynamic SQL is still processed through package-based infrastructure for authorization and caching purposes, meaning collections/packages remain relevant even to 'dynamic-SQL-only' remote applications.</li>
        <li><strong>WLM integration</strong> — DDF work can be classified into WLM service classes, allowing prioritization of, say, a critical online channel's queries above a lower-priority reporting connection sharing the same subsystem.</li>
        <li><strong>Connection/thread management</strong> — DDF threads have their own pooling and idle-thread behavior distinct from local (non-DDF) threads; monitoring active/idle DDF threads is a routine operational task (see -DISPLAY THREAD, Module 16).</li>
      </ul>
      <p>What a LUW DBA should unlearn: there is no single simple 'the database process listens on a port and that's the whole connection story.' On z/OS, a remote connection passes through DDF, is authorized (RACF + Db2), resolves through package/collection infrastructure, and can be governed by WLM classification — a longer, more structured path than a typical LUW client/server connection.</p>`,
    visual:`<div class="diagram"><div class="box-tree">Remote application (JDBC/ODBC/.NET driver)
   │  DRDA over TCP/IP
   ▼
DDF (DIST address space)
   │  authorization (RACF + Db2) + package/collection resolution
   ▼
WLM classification  ── priority/service class assignment
   │
   ▼
Db2 engine (DBM1) executes the request</div></div>`,
    example:"DDF threads are accumulating and response times are degrading (a scenario revisited in Module 32). The DBA uses -DISPLAY THREAD(*) TYPE(ACTIVE) and DDF-specific displays to distinguish between genuinely active work, idle-but-held threads, and connections stuck waiting on a resource — a triage sequence with no exact single-command LUW equivalent, since DDF's thread model has its own idle/active state machine.",
    handsOn:"List three reasons DDF threads might accumulate: (1) an application not closing connections properly, (2) a WLM service class starving DDF work of engine resources, (3) a lock/resource wait blocking otherwise-idle threads from completing. For each, name the first command or catalog check you'd run to confirm it.",
    trap:"Don't assume 'the connection is closed on the client side' means 'the server-side resource is released.' DDF thread pooling and idle-thread timeout behavior are configurable and can keep resources allocated longer than a LUW DBA might expect from a typical driver-managed connection pool.",
    remember:[
      "DDF (DIST address space) is the gateway for all remote DRDA connections.",
      "Even dynamic SQL from remote clients resolves through package/collection infrastructure for authorization.",
      "WLM can classify and prioritize DDF work independently from other subsystem activity.",
      "DDF thread accumulation is a classic, recurring production incident pattern — know the diagnostic commands.",
      "DDF's thread pooling/idle behavior doesn't map 1:1 onto typical LUW client driver connection pooling assumptions."
    ],
    check:[
      {q:"What protocol do remote JDBC/ODBC clients use under the hood to connect to Db2 for z/OS via DDF?", options:["HTTP/REST only","DRDA","SSH","NFS"], answer:1, explain:"DRDA (Distributed Relational Database Architecture) is the wire protocol DDF uses for remote connections."},
      {q:"Which address space handles DDF/remote connections?", options:["MSTR","DBM1","DIST","IRLM"], answer:2, explain:"DIST is the address space that implements DDF."},
      {q:"Why do even 'purely dynamic SQL' remote applications still interact with package/collection infrastructure?", options:["They don't — dynamic SQL bypasses packages entirely","Dynamic SQL execution and authorization for DDF connections still resolves through package-based infrastructure","Because DRDA requires COBOL source code","Packages are only used for batch jobs"], answer:1, explain:"Package/collection infrastructure remains relevant to authorization and caching even for dynamic SQL over DDF."}
    ],
    deep:"", sources:[["IBM Documentation — Db2 for z/OS DDF / DRDA","https://www.ibm.com/docs/en/db2-for-zos"]]
  })]
});

COURSE.modules.push({
  id:"m20", num:"20", title:"Locking and Concurrency", level:"core",
  blurb:"Locks, claims, drains, timeouts, deadlocks, escalation, and utility/application concurrency.",
  lessons:[ L({
    id:"m20-l1", title:"Locking, Claims, and Drains",
    why:"Locking theory transfers almost completely from LUW — but Db2 for z/OS adds a second concurrency mechanism, claims and drains, specifically to coordinate utilities against concurrently running applications. Missing this causes real incidents (Module 32's REORG timeout scenario).",
    luw:{ know:"Row/table locks, lock modes, isolation levels, deadlock detection, lock escalation, and timeout behavior — all deeply familiar.",
          changes:"All of that theory applies directly on z/OS. What's added is claims and drains: a separate mechanism utilities use to coordinate access to table spaces/indexes, distinct from regular application locking, so utilities can run with controlled, well-defined concurrency (via SHRLEVEL) against ongoing application access.",
          why:"Utilities like online REORG need to run for extended periods against live, hot objects — claims/drains give a lighter-weight, utility-aware coordination mechanism (tracking who is 'claiming' access to an object and letting a utility 'drain' those claims at controlled points) that doesn't rely purely on standard application locking, which would be too coarse or too disruptive for long-running utility phases." },
    concept:`<p>Two coordination mechanisms coexist:</p>
      <ul>
        <li><strong>Locks</strong> — the familiar mechanism: page/row/table-level locks with modes (S, X, IS, IX, etc.), isolation levels (UR, CS, RS, RR — conceptually parallel to LUW isolation levels), timeout (resource unavailable within IRLM's timeout threshold) and deadlock detection (two-or-more-way cycles broken by IRLM).</li>
        <li><strong>Claims and drains</strong> — a utility-oriented mechanism: an application "claims" a table space/index/partition when it accesses it, releasing the claim when done; a utility that needs more exclusive-ish control "drains" existing claims (waiting for them to release, then blocking new ones) at defined points, enabling utilities like online REORG to alternate between allowing concurrent access and briefly asserting more control.</li>
      </ul>
      <p>Escalation and troubleshooting concepts are highly portable from LUW: lock escalation still means many fine-grained locks being converted to a coarser lock to save resources (with the same downside — reduced concurrency), and deadlock diagnosis still follows "identify the cycle, identify which transaction was chosen as victim, understand why." The framework difference is that utility-vs-application contention often shows up as claim/drain waits, not ordinary lock waits — and the diagnostic commands/messages differ accordingly.</p>`,
    visual:`<div class="diagram"><div class="box-tree">Application concurrency:  Locks (S/X/IS/IX...) + isolation levels + timeout/deadlock detection
                                   (directly familiar from LUW)

Utility concurrency:      Claims (apps mark "I'm using this object")
                                   +
                           Drains (utility waits out existing claims, then
                                   blocks new ones at a controlled point)
                                   (new mechanism, specific to utility execution)</div></div>`,
    example:"Application threads are timing out during a large REORG (the Module 20 scenario referenced by Module 32). The DBA checks whether the REORG's SHRLEVEL and drain behavior are appropriate for the object's access pattern, and whether a long-running application transaction is holding a claim the utility needs to drain — a diagnostic path that has no exact LUW parallel, since LUW's REORG concurrency model doesn't use a claim/drain mechanism by that name.",
    handsOn:"For a hot OLTP table space needing a REORG during business hours, decide: would you expect claims/drains or ordinary locking to be the dominant coordination mechanism during the utility's execution? Justify your answer using SHRLEVEL CHANGE behavior from Module 15.",
    trap:"Don't diagnose a utility-related timeout purely with the same lock-wait mental model you'd use for two applications blocking each other. If a utility is involved, claims and drains are very likely part of the picture, and the fix (e.g., adjusting utility timing, SHRLEVEL, or application transaction length) differs from a typical two-application deadlock fix.",
    remember:[
      "Standard locking theory (modes, isolation levels, escalation, deadlocks) transfers almost completely from LUW.",
      "Claims and drains are a second, utility-specific coordination mechanism with no direct LUW equivalent.",
      "Online utilities (like REORG SHRLEVEL CHANGE) rely on claims/drains to balance concurrency with control.",
      "A utility-related timeout often means a claim/drain wait, not an ordinary application lock wait.",
      "Long-running application transactions can block a utility's drain — a common root cause worth checking first."
    ],
    check:[
      {q:"What is the purpose of claims and drains?", options:["They replace all locking entirely","They coordinate utility access to objects against ongoing application access, distinct from standard locking","They are only used for security auditing","They control buffer pool page replacement"], answer:1, explain:"Claims/drains are a utility-specific coordination mechanism layered alongside, not replacing, standard locking."},
      {q:"Application threads are timing out during a REORG. What should you suspect first?", options:["A buffer pool sizing issue only","A claim/drain wait caused by long-running application transactions or utility timing","A RACF authorization failure","A JCL syntax error"], answer:1, explain:"Utility-related concurrency issues frequently trace back to claim/drain waits."},
      {q:"Which concurrency concepts transfer almost completely from Db2 LUW to Db2 for z/OS?", options:["Nothing transfers","Lock modes, isolation levels, deadlock detection, and lock escalation","Only deadlock detection","Claims and drains"], answer:1, explain:"Standard locking theory is highly portable; claims/drains are the genuinely new addition."}
    ],
    deep:"", sources:[["IBM Documentation — Db2 for z/OS Locking","https://www.ibm.com/docs/en/db2-for-zos"]]
  })]
});

COURSE.modules.push({
  id:"m21", num:"21", title:"Optimizer and Access Paths", level:"core",
  blurb:"EXPLAIN, PLAN_TABLE, access paths, and how REBIND-driven access path change differs from LUW's runtime re-optimization.",
  lessons:[ L({
    id:"m21-l1", title:"EXPLAIN and Access Path Stability",
    why:"You already understand cost-based optimization deeply. What matters here is one structural difference: static SQL access paths are chosen at BIND time and stay frozen — so 'the optimizer picked a bad plan' investigations often start with 'when was this last bound,' not just 'what do current statistics say.'",
    luw:{ know:"EXPLAIN/db2expln, Explain tables, cost-based optimization using catalog statistics, cardinality estimation, filter factors.",
          changes:"Db2 for z/OS's EXPLAIN statement populates PLAN_TABLE (and related tables like DSN_STATEMNT_TABLE, DSN_FUNCTION_TABLE) with very similar information — access path chosen, index usage, join method, sort requirements. The key operational difference is when this access path was decided: for static SQL, it was frozen at the last BIND/REBIND, not recalculated per execution.",
          why:"Freezing access paths at bind time gives predictable, low-latency execution for high-volume static SQL transaction workloads, trading off automatic adaptation to changing data for consistency and speed — a deliberate tradeoff rooted in the platform's OLTP-heavy heritage (Module 18)." },
    concept:`<p>Core workflow:</p>
      <ol>
        <li>Run EXPLAIN (for dynamic SQL) or BIND/REBIND with EXPLAIN(YES) (for static SQL/packages) to populate PLAN_TABLE.</li>
        <li>Query PLAN_TABLE to see the chosen access path: table access method (index/table space scan), index used, join sequence and method, sort requirements (similar structure to LUW's explain output).</li>
        <li>For static SQL, correlate the access path with when the package was last bound — a package bound six months ago against very different data volumes may be running a stale, now-suboptimal plan.</li>
        <li>REBIND (Module 18) to let the optimizer reconsider using current statistics — but understand the risk: REBIND can also introduce a regression (a "improved" plan that's actually worse for this specific workload's patterns), which is why production shops carefully test/compare access paths before and after REBIND (plan management/stability features exist to help).</li>
      </ol>
      <p>Underlying optimizer concepts — cardinality estimation, filter factors, join method selection (nested loop, merge scan, hybrid join), index matching — are conceptually identical to what you already know from LUW's optimizer; the differences are almost entirely about when and how the chosen plan gets "locked in" and revisited.</p>`,
    visual:`<div class="diagram"><div class="box-tree">Dynamic SQL:  prepare → optimize → execute      (re-optimizes each time, like LUW)

Static SQL:   BIND/REBIND → optimize → <span class="hl">FREEZE access path</span> → many executions
                    ▲                                                  │
                    └──────────────── REBIND to re-evaluate ◄──────────┘</div></div>`,
    example:"A batch job's runtime suddenly triples after a routine maintenance window. The investigation starts not with 'what's slow in this SQL' but with 'was this package rebound recently, and did RUNSTATS run beforehand' — because an automatic or scheduled REBIND picking a new, worse access path is a classic, well-known regression pattern on this platform.",
    handsOn:"Write the two-line diagnostic sequence you'd follow for 'a static SQL package's performance regressed after last night's maintenance window': (1) check PLAN_TABLE/bind timestamp to see if it was rebound, (2) compare the new access path against a saved prior EXPLAIN output (or use access path stability tooling) to identify what changed.",
    trap:"Don't assume 'the statistics are current, so the plan must be optimal' the way you might reflexively think about a LUW dynamic SQL statement re-preparing fresh each time. For static SQL, current statistics only matter as of the last BIND/REBIND — a package can be running on a frozen plan chosen against statistics from months ago.",
    remember:[
      "PLAN_TABLE and EXPLAIN output are structurally familiar from LUW.",
      "Dynamic SQL re-optimizes per execution, much like LUW; static SQL freezes its access path at BIND/REBIND time.",
      "A performance regression investigation for static SQL should check 'was this rebound recently' early, not last.",
      "REBIND can fix a stale plan — but can also introduce a new regression; compare before/after access paths.",
      "Core optimizer concepts (cardinality, filter factors, join methods) are the same theory you already know."
    ],
    check:[
      {q:"When is a static SQL package's access path chosen?", options:["Fresh at every execution, like dynamic SQL","At BIND/REBIND time, then frozen until the next REBIND","Only when EXPLAIN is run manually","Access paths don't apply to static SQL"], answer:1, explain:"Static SQL access paths are frozen at bind time, unlike dynamic SQL which re-optimizes per execution."},
      {q:"A batch job's performance suddenly regresses after a maintenance window. What's an important early diagnostic step?", options:["Assume it's unrelated to any bind activity","Check whether the package was recently rebound and compare access paths before/after","Immediately drop and recreate all indexes","Restart the whole subsystem"], answer:1, explain:"Recent REBIND activity picking a new, worse access path is a classic regression pattern worth checking first."},
      {q:"Which optimizer concepts are essentially identical in theory between Db2 LUW and Db2 for z/OS?", options:["None — the optimizers are unrelated","Cardinality estimation, filter factors, and join method selection","Only index matching","Optimizers don't exist on z/OS"], answer:1, explain:"Core cost-based optimization theory is shared; the platform difference is about when/how the plan is locked in."}
    ],
    deep:`<p data-level="expert"><span class="levelmark expert">Expert</span> Plan management / access path stability features (allowing comparison and controlled fallback between prior and new access paths across a REBIND) exist to reduce REBIND regression risk in production — verify current feature names and syntax against your Db2 version's documentation, as capabilities have evolved across Db2 11/12/13.</p>`,
    sources:[["IBM Documentation — Db2 for z/OS EXPLAIN and access paths","https://www.ibm.com/docs/en/db2-for-zos"]]
  })]
});

COURSE.modules.push({
  id:"m22", num:"22", title:"Db2 Performance", level:"core",
  blurb:"CPU, I/O, getpages, prefetch, RID processing, sort/work files, and DDF/package performance in practice.",
  lessons:[ L({
    id:"m22-l1", title:"Practical Production Performance Diagnosis",
    why:"Performance troubleshooting instincts transfer well from LUW — the vocabulary and evidence sources are what differ. This lesson maps familiar diagnostic questions onto z/OS-specific evidence.",
    luw:{ know:"Diagnosing slow queries via EXPLAIN, monitoring buffer pool hit ratios, sort/temp space usage, lock waits, and I/O wait time using db2pd/MON_GET views.",
          changes:"The diagnostic questions are the same; the evidence sources are traces (accounting/statistics), catalog/real-time statistics tables, and Db2 commands rather than MON_GET table functions — but the underlying concepts (getpages, synchronous vs. prefetch reads, sort/work file usage, RID list processing) map closely to what you already reason about." },
    concept:`<p>Core performance vocabulary, mapped:</p>
      <div class="table-scroll"><table>
      <tr><th>Concept</th><th>What it means</th><th>LUW parallel</th></tr>
      <tr><td>Getpage</td><td>A logical request for a page, whether satisfied from buffer pool or disk</td><td>Logical read</td></tr>
      <tr><td>Synchronous read</td><td>A getpage that must wait for a physical I/O (buffer pool miss, no prefetch)</td><td>Physical read (uncached)</td></tr>
      <tr><td>Prefetch (sequential/list/dynamic)</td><td>Db2 reading ahead pages it predicts will be needed, reducing synchronous read waits</td><td>Similar to read-ahead prefetching concepts in LUW</td></tr>
      <tr><td>Sequential detection</td><td>Db2 dynamically recognizing a sequential access pattern and triggering prefetch</td><td>Similar adaptive read-ahead logic</td></tr>
      <tr><td>RID processing / RID list</td><td>Row ID list processing used for certain access paths (e.g., multiple index access, list prefetch)</td><td>Bitmap/RID-based access path techniques</td></tr>
      <tr><td>Sort / work files</td><td>Work file database used for sorts, joins needing work space, and other intermediate results</td><td>Sort heap / temp tablespace usage</td></tr>
      <tr><td>Package/DDF performance</td><td>Whether a package's static access path, or DDF connection/thread overhead, is contributing to latency</td><td>Roughly comparable to prepared-statement caching and connection pool health</td></tr>
      </table></div>
      <p>Diagnostic sources: accounting traces (per-thread resource consumption — CPU, elapsed, wait breakdown), statistics traces (subsystem-wide rates), and real-time statistics catalog tables (e.g., for object-level activity) — covered further in Module 24.</p>`,
    visual:`<div class="diagram"><div class="box-tree">Slow transaction investigation
  │
  ├─ CPU-bound?         → check accounting trace CPU time, access path efficiency
  ├─ I/O-bound?         → check getpage/synchronous-read counts, buffer pool hit ratio
  ├─ Lock-bound?        → check lock/claim wait time in accounting trace
  ├─ Sort/work-file-bound? → check work file database activity
  └─ DDF-bound?         → check DDF thread/connection-level wait breakdown</div></div>`,
    example:"An application team reports 'the database is slow.' Instead of guessing, the DBA pulls an accounting trace summary for the affected package/plan and breaks elapsed time into CPU, synchronous I/O wait, lock/claim wait, and other wait categories — the same structured 'where did the time go' decomposition a LUW DBA would do with db2pd/MON_GET, just sourced from Db2 traces instead.",
    handsOn:"Given an accounting trace summary showing 80% of elapsed time in synchronous I/O wait for a package, name two plausible root causes and the next piece of evidence you'd pull for each (buffer pool too small for the object's working set → check hit ratio/getpage counts; access path doing more random I/O than expected → check EXPLAIN/PLAN_TABLE).",
    trap:"Don't assume 'CPU busy' automatically means 'inefficient SQL.' On a shared subsystem, WLM service class priority and contention from other workloads can starve a well-tuned package of CPU — always check whether the delay is really in this package's own processing or in waiting for a resource governed elsewhere (Module 23).",
    remember:[
      "Getpage/synchronous read/prefetch concepts map closely to logical/physical read concepts from LUW.",
      "Structured 'where did the time go' decomposition (CPU/I/O/lock/sort/DDF) is the core diagnostic method, just as in LUW.",
      "Accounting traces provide per-thread/package resource breakdowns; statistics traces provide subsystem-wide rates.",
      "Work files (sort/join intermediate results) are a distinct database worth monitoring, similar to LUW temp/sort space.",
      "Not all slowness is SQL-caused — WLM priority and shared-subsystem contention can be the real culprit."
    ],
    check:[
      {q:"What is a Db2 for z/OS 'getpage' roughly equivalent to?", options:["A physical disk write","A logical read request for a page","A network round trip","A lock escalation event"], answer:1, explain:"A getpage is a logical page request, whether or not it results in physical I/O."},
      {q:"Which trace type gives per-thread/package resource consumption breakdown (CPU, I/O wait, lock wait)?", options:["Accounting trace","Archive log","BSDS","Catalog statistics only"], answer:0, explain:"Accounting traces capture per-thread/package resource consumption detail."},
      {q:"Why might a well-tuned package still show high elapsed time on a busy shared subsystem?", options:["This is impossible on z/OS","WLM service class priority/contention can delay it even if its own SQL is efficient","Static SQL is always slow","Buffer pools don't apply to well-tuned packages"], answer:1, explain:"Shared-subsystem contention and WLM prioritization can cause delay independent of the SQL's own efficiency."}
    ],
    deep:"", sources:[["IBM Documentation — Db2 for z/OS Performance monitoring and tuning","https://www.ibm.com/docs/en/db2-for-zos"]]
  })]
});

COURSE.modules.push({
  id:"m23", num:"23", title:"WLM (Workload Manager)", level:"core",
  blurb:"z/OS's system-wide resource manager and how Db2 delegates prioritization to it.",
  lessons:[ L({
    id:"m23-l1", title:"WLM and Db2's Workload Prioritization",
    why:"WLM is a z/OS-wide facility, not a Db2 feature — but Db2 relies on it heavily for prioritizing stored procedures, DDF work, and utilities. A DBA needs at least conceptual fluency here, even without owning WLM policy directly.",
    luw:{ know:"Workload management inside the database engine itself — e.g., connection concurrency limits, resource governors, or workload-class-based throttling defined in the database configuration.",
          changes:"On z/OS, WLM operates above and across all subsystems on the LPAR/sysplex, classifying work (including Db2 stored procedure calls, DDF transactions, and utility jobs) into service classes with importance levels and performance goals, and the operating system dispatcher honors those classifications when allocating CPU and other resources.",
          why:"Because z/OS routinely runs many different products and workloads sharing one machine, resource prioritization needed to be a system-wide concern, not something each product manages independently — WLM is the platform's answer to fair, goal-driven sharing of a large shared machine." },
    concept:`<p>Key concepts:</p>
      <ul>
        <li><strong>Service class</strong> — a named category of work with a performance goal (e.g., "90% of transactions complete within 0.5 seconds") and an importance level.</li>
        <li><strong>Classification rules</strong> — determine which service class incoming work (a DDF transaction, a stored procedure call, a batch job) is assigned to, often based on attributes like userid, transaction/procedure name, or subsystem.</li>
        <li><strong>Importance</strong> — when the system is constrained, WLM favors higher-importance work over lower, even if both have goals — this is why a low-priority reporting workload can be deliberately starved to protect OLTP response times.</li>
        <li><strong>Db2's WLM integration points</strong> — stored procedure/UDF execution address spaces (SPAS) run under WLM management; DDF transactions can be classified into service classes; utility execution can also be influenced by WLM in some configurations.</li>
      </ul>
      <p>A DBA's practical relationship to WLM is usually collaborative: DBAs identify which Db2 workloads need which priority, and a systems/WLM administrator (sometimes the same person, often a separate role) implements the classification and goals.</p>`,
    visual:`<div class="diagram"><div class="box-tree">Incoming work (DDF transaction / stored proc call / utility)
   │
   ▼
WLM classification rules  ── assign a service class
   │
   ▼
Service class (goal + importance)
   │
   ▼
z/OS dispatcher honors goals when allocating CPU/resources across ALL workloads on the LPAR</div></div>`,
    example:"A critical online banking transaction and a lower-priority nightly reporting job both run stored procedures on the same subsystem. WLM classification ensures the banking transaction's service class has higher importance, so under CPU contention the dispatcher favors it — a form of prioritization that happens above and outside Db2 itself, unlike a database-engine-internal workload governor.",
    handsOn:"For a new DDF-based microservice hitting the same subsystem as existing batch work, list the WLM-related question you'd ask before go-live: 'what service class and importance should this workload's transactions be classified into, relative to existing critical workloads?' — then explain why this conversation involves a systems/WLM team, not just the DBA team alone.",
    trap:"Don't assume Db2 has its own independent, self-contained workload governor the way some database engines do. On z/OS, prioritization for stored procedures, DDF, and (in some configurations) utilities is delegated to WLM — a genuinely separate z/OS facility with its own administration.",
    remember:[
      "WLM is a z/OS-wide facility, not something owned/configured purely within Db2.",
      "Service classes carry goals (response time targets) and importance levels.",
      "Db2 delegates prioritization for SPAS-hosted stored procedures and DDF transactions to WLM.",
      "Under contention, WLM favors higher-importance work, even across completely different products sharing the LPAR.",
      "WLM policy changes are often a joint DBA + systems/WLM administrator conversation."
    ],
    check:[
      {q:"What is WLM?", options:["A Db2-specific configuration parameter","A z/OS-wide facility that classifies and prioritizes work across all subsystems sharing the machine","A type of buffer pool","A Db2 utility"], answer:1, explain:"WLM operates at the z/OS level, governing resource allocation across all workloads on the system, not just Db2."},
      {q:"Which Db2 for z/OS components commonly integrate with WLM?", options:["Only the BSDS","Stored procedure address spaces (SPAS) and DDF transaction classification","Only RUNSTATS","Only the catalog"], answer:1, explain:"SPAS execution and DDF transaction classification are common Db2/WLM integration points."},
      {q:"Under resource contention, how does WLM decide which work to favor?", options:["Random selection","By importance level assigned to each work's service class","Alphabetically by job name","It never favors any workload"], answer:1, explain:"WLM favors higher-importance service classes when resources are constrained."}
    ],
    deep:"", sources:[["IBM Documentation — z/OS Workload Manager","https://www.ibm.com/docs/en/zos/latest?topic=guides-workload-manager"]]

COURSE.modules.push({
  id:"m24", num:"24", title:"Tracing and Monitoring", level:"core",
  blurb:"Db2 traces, accounting/statistics classes, IFCIDs conceptually, SMF, and choosing the right evidence.",
  lessons:[ L({
    id:"m24-l1", title:"Choosing the Right Evidence",
    why:"The goal isn't memorizing every trace class — it's learning to ask 'what information do I need to diagnose this problem' and knowing which trace/monitoring facility answers that question.",
    luw:{ know:"Event monitors, MON_GET table functions, db2pd, and application-level tracing for diagnosing performance and correctness issues.",
          changes:"Db2 for z/OS instrumentation is built around trace classes (accounting, statistics, performance, audit, monitor) that generate IFCIDs (Instrumentation Facility Component Identifiers — individual trace record types), which can be routed to SMF (System Management Facilities, a z/OS-wide instrumentation/accounting record repository) for later analysis, often via vendor or IBM performance monitoring tools.",
          why:"SMF is a platform-wide facility used by many z/OS products for accounting and instrumentation data, so Db2 hooking into it lets shops use consistent, centralized tooling and retention policies for performance data across their whole environment, not just Db2." },
    concept:`<p>The main trace classes a DBA should know conceptually:</p>
      <ul>
        <li><strong>Accounting trace</strong> — per-thread/package resource consumption (CPU, elapsed, I/O, lock wait) — your primary tool for "why was this specific unit of work slow" (Module 22).</li>
        <li><strong>Statistics trace</strong> — subsystem-wide rates and counters (buffer pool activity, lock activity, EDM pool usage) at a system level, not per-thread — your tool for "how is the subsystem as a whole doing."</li>
        <li><strong>Performance trace</strong> — very detailed, high-overhead event-level tracing, typically enabled narrowly and temporarily for deep investigation, not run continuously.</li>
        <li><strong>Audit trace</strong> — security-relevant events (authorization changes, access to audited objects).</li>
        <li><strong>Monitor trace</strong> — feeds real-time monitoring tools/interfaces.</li>
      </ul>
      <p><strong>IFCIDs</strong> are the individual record types within these trace classes (e.g., a specific IFCID might record a deadlock event, another a buffer pool statistics snapshot) — you don't need to memorize IFCID numbers, but should understand that "turning on a trace class" means "start collecting a defined set of IFCIDs," and that granular IFCID-level control exists for advanced tuning of trace overhead. <strong>SMF</strong> is where these trace records typically land for later analysis, alongside many other z/OS products' instrumentation data.</p>
      <div class="callout">The right question is never "which trace should I always run" — it's "what information does THIS problem need," matched against the table above.</div>`,
    visual:`<div class="diagram"><div class="box-tree">Question                              Trace class
"Why was THIS transaction slow?"   →  Accounting trace
"How is the subsystem doing overall?" → Statistics trace
"I need deep, detailed event data"  →  Performance trace (narrow, temporary)
"Who accessed this audited object?" →  Audit trace
"Feed my real-time monitor"         →  Monitor trace
                                          │
                                          ▼
                                    IFCIDs → routed to SMF</div></div>`,
    example:"A DBA needs to explain a specific batch job's 3am slowdown to management. They pull accounting trace detail for that job's package (not a system-wide statistics trace, which wouldn't isolate this one job), correlating CPU/I/O/lock wait breakdown with the timeline — mirroring the same 'get the right-grained evidence' discipline used with LUW event monitors targeted at a specific application.",
    handsOn:"For each question, name the trace class you'd reach for first: (1) 'Is buffer pool BP3 hit ratio degrading system-wide over the past week?' (statistics trace); (2) 'Why did this one online transaction take 4 seconds at 2:15pm?' (accounting trace); (3) 'Who changed this table's authorization last month?' (audit trace).",
    trap:"Don't leave performance trace running continuously 'just in case' — it's the most detailed and highest-overhead trace class, intended for narrow, temporary deep-dive use, not standing production monitoring. This is a common overreach mistake for DBAs used to lower-overhead LUW event monitoring.",
    remember:[
      "Accounting trace = per-thread/package detail; statistics trace = subsystem-wide rates.",
      "Performance trace is detailed but high-overhead — use narrowly and temporarily, not continuously.",
      "IFCIDs are the individual trace record types underlying each trace class.",
      "SMF is the platform-wide repository where Db2 (and other products') trace records typically land.",
      "Always start from 'what question am I answering,' then pick the matching trace class."
    ],
    check:[
      {q:"Which trace class would you use to diagnose why one specific transaction was slow?", options:["Statistics trace","Accounting trace","Audit trace only","None — this isn't traceable"], answer:1, explain:"Accounting trace provides per-thread/package resource consumption detail needed to diagnose one transaction's slowness."},
      {q:"What are IFCIDs?", options:["Db2 command names","Individual trace record types underlying the trace classes","A type of buffer pool","A security credential"], answer:1, explain:"IFCIDs (Instrumentation Facility Component Identifiers) are the individual trace record types that make up trace classes."},
      {q:"Why should performance trace generally NOT run continuously in production?", options:["It's illegal to run it","It is detailed and high-overhead, intended for narrow, temporary deep-dive investigation","It only works in test environments","It has no relationship to overhead"], answer:1, explain:"Performance trace's detail level comes with meaningful overhead, so it's typically used narrowly and temporarily."}
    ],
    deep:"", sources:[["IBM Documentation — Db2 for z/OS Trace facility","https://www.ibm.com/docs/en/db2-for-zos"],["IBM Documentation — SMF","https://www.ibm.com/docs/en/zos/latest?topic=guides-smf"]]
  })]
});

COURSE.modules.push({
  id:"m25", num:"25", title:"Data Sharing", level:"core",
  blurb:"Parallel Sysplex, the coupling facility, group buffer pools, and why data sharing is not 'pureScale renamed.'",
  lessons:[ L({
    id:"m25-l1", title:"Data Sharing and Parallel Sysplex",
    why:"Data sharing is mandatory knowledge for any production Db2 for z/OS DBA and is one of the platform's genuinely novel concepts. Treat this as new material, not a renamed version of something you already know.",
    luw:{ know:"HADR (primary/standby log shipping and failover) and pureScale (active-active clustering using a shared-storage/central lock/cache manager design with a Cluster Caching Facility).",
          changes:"Db2 for z/OS data sharing lets multiple Db2 subsystems (members), each on a separate z/OS LPAR within a Parallel Sysplex, actively read and write the SAME databases concurrently, coordinating through a Coupling Facility (CF) that provides shared, high-speed structures for global locking and group buffer pools (cross-member page coherency). It is explicitly NOT a rename of pureScale — different architecture, different history, different operational model — and it is not the same failover model as HADR.",
          why:"IBM Z's Parallel Sysplex clustering (Module 1's timeline) was designed to let multiple full systems share workload and provide continuous availability at a hardware/OS level; data sharing extends that same philosophy into Db2, giving true active-active scale-out and availability without the primary/standby asymmetry of HADR." },
    concept:`<p>Core components:</p>
      <ul>
        <li><strong>Parallel Sysplex</strong> — a cluster of z/OS LPARs (potentially across physical machines) connected via high-speed coupling links, coordinated by one or more Coupling Facilities.</li>
        <li><strong>Coupling Facility (CF)</strong> — specialized shared memory/processing resource (its own LPAR or dedicated hardware) hosting structures used for cross-system coordination.</li>
        <li><strong>Db2 members</strong> — each Db2 subsystem participating in a data sharing group is a "member," running on its own LPAR, with its own local buffer pools, but coordinating globally through the CF.</li>
        <li><strong>Group</strong> — the collection of members sharing the same databases, acting logically as one Db2 to applications (which can connect to any member).</li>
        <li><strong>Global locking</strong> — IRLM on each member coordinates with CF-based lock structures so locks are honored consistently across the whole group, not just locally.</li>
        <li><strong>Group Buffer Pools (GBP)</strong> — CF-resident structures that maintain page coherency across members' local buffer pools — when one member changes a page, the group buffer pool mechanism ensures other members see a consistent view rather than stale cached data.</li>
        <li><strong>Member failure</strong> — if one member fails, the others continue serving all databases (the data was never partitioned by member), and surviving members can even take over some in-flight recovery responsibilities — a materially different failure model than HADR's single-standby-takes-over pattern.</li>
      </ul>
      <div class="callout">Why data sharing exists: continuous availability (no member is a single point of failure for the whole group), horizontal scale-out for capacity, and workload balancing across members — all while keeping one logical, fully consistent copy of the data.</div>`,
    visual:`<div class="diagram"><div class="box-tree">                    Parallel Sysplex
                          │
        ┌─────────────────┼─────────────────┐
        │                 │                 │
      DB2A              DB2B              DB2C      (members, each its own LPAR)
        │                 │                 │
        └─────────────────┼─────────────────┘
                          │
                  Coupling Facility (CF)
                          │
              Global lock structures + Group Buffer Pools
              (shared, coherent structures ALL members use)</div></div>`,
    example:"During a rolling Db2 maintenance upgrade, one member is quiesced and taken down for software maintenance while the other members continue serving all applications without interruption — a routine, planned-outage-avoidance pattern that is one of data sharing's primary business justifications, distinct from HADR's typical primary/standby role-switch pattern.",
    handsOn:"Explain, in your own words, why 'data sharing is not pureScale renamed' — name at least two structural differences (e.g., pureScale's Cluster Caching Facility vs. the Coupling Facility's broader sysplex role; Db2 for z/OS members running as full independent subsystems on separate LPARs vs. pureScale's member architecture).",
    trap:"The most damaging trap here is assuming you already understand data sharing because it 'sounds like' pureScale. Interview questions, design conversations, and real incidents will expose this gap quickly — treat data sharing as genuinely new material requiring its own study, not a vocabulary substitution exercise.",
    remember:[
      "Data sharing = multiple Db2 members, each a full subsystem on its own LPAR, actively reading/writing the same data concurrently.",
      "The Coupling Facility provides shared structures for global locking and group buffer pool page coherency.",
      "Data sharing is explicitly NOT a rename of pureScale, and its failure model differs from HADR's primary/standby pattern.",
      "Member failure doesn't take the data offline — surviving members continue serving all databases.",
      "Business justification: continuous availability, horizontal scale-out, and workload balancing without data partitioning."
    ],
    check:[
      {q:"What is the correct relationship between Db2 for z/OS data sharing and Db2 LUW pureScale?", options:["They are the same technology with different names","Data sharing is a genuinely distinct architecture, not a rename of pureScale","pureScale replaced data sharing","Data sharing only supports read-only replicas"], answer:1, explain:"Data sharing has its own distinct architecture and history — treating it as 'pureScale renamed' is a documented trap for LUW DBAs."},
      {q:"What role does the Coupling Facility play in data sharing?", options:["It stores archive logs only","It provides shared structures for global locking and group buffer pool coherency across members","It replaces RACF","It is only used for backup"], answer:1, explain:"The CF hosts shared structures enabling cross-member lock coordination and buffer pool coherency."},
      {q:"What happens to data availability when one data-sharing member fails?", options:["All data becomes unavailable until that member restarts","Surviving members continue serving all databases, since data isn't partitioned by member","Only that member's 'partition' of data is affected","Data sharing has no failure tolerance"], answer:1, explain:"Because members share full access to all data, surviving members can continue serving all databases after one member fails."}
    ],
    deep:`<p data-level="expert"><span class="levelmark expert">Expert</span> Structures in the CF (lock structures, group buffer pools, and shared communications structures) each have their own sizing, duplexing, and failure-recovery considerations; CF failure/rebuild scenarios and cross-invalidation performance tuning are genuine specialist topics — verify current sizing guidance and structure duplexing recommendations against IBM Documentation and Redbooks for your Db2/CFCC level.</p>`,
    sources:[["IBM Documentation — Db2 for z/OS Data sharing","https://www.ibm.com/docs/en/db2-for-zos"],["IBM Documentation — Parallel Sysplex","https://www.ibm.com/docs/en/zos/latest?topic=overview-parallel-sysplex"],["IBM Redbooks — Data sharing","https://www.redbooks.ibm.com"]]
  })]
});

    remember:[

      {q:"What does GDPS primarily address?", options:["SQL tuning","Cross-site disaster recovery automation built on Parallel Sysplex concepts","Buffer pool sizing","RACF password policy"], answer:1, explain:"GDPS provides geographically dispersed sysplex automation for disaster recovery scenarios."},
      {q:"How does Db2 LUW's HA approach differ structurally from Db2 for z/OS's?", options:["They are identical","LUW's HA is largely a database-engine feature; z/OS's HA is a platform-level capability Db2 participates in","LUW has no HA options","z/OS has no HA options"], answer:1, explain:"Db2 for z/OS's HA relies on the platform's Parallel Sysplex capability, while LUW's HA is implemented mostly within the database engine itself."}
    ],

COURSE.modules.push({
  id:"m27", num:"27", title:"Backup, Recovery, and Disaster Recovery Scenarios", level:"deep",
  blurb:"Realistic enterprise recovery scenarios applying Module 14's logging/recovery model.",
  lessons:[ L({
    id:"m27-l1", title:"Recovery Scenario Walkthroughs",
    why:"Recovery knowledge only becomes real under scenario pressure. This lesson applies the troubleshooting framework (Symptom → Scope → Evidence → Hypothesis → Test → Action → Validation → Root Cause) to realistic incidents.",
    luw:null,
    concept:`<p>Work through each scenario using the framework before checking the reasoning notes.</p>
      <div class="grid2">
        <div class="card"><h4>1. Accidental DROP TABLE in production</h4>
          <p><strong>Reasoning:</strong> Scope = one table's table space. Evidence = last good image copy timestamp, log range since then. Action = RECOVER the table space to just before the DROP (point-in-time), understanding that DROP is a DDL/catalog change requiring careful handling — in some cases a full table space-level RECOVER to a prior point plus catalog reconciliation is needed. Validate row counts/application checks before declaring success.</p></div>
        <div class="card"><h4>2. Corrupted table space discovered</h4>
          <p><strong>Reasoning:</strong> Run CHECK DATA/CHECK INDEX to scope the corruption. If confirmed, RECOVER from the last valid image copy + logs, or REBUILD INDEX if only index structures are affected. Root-cause: was this a media failure, an aborted utility, or an application bug writing bad data?</p></div>
        <div class="card"><h4>3. Failed DASD volume</h4>
          <p><strong>Reasoning:</strong> Scope = every dataset with extents on that volume (could span many table spaces/indexes). Evidence from storage team/SMS. Action = RECOVER affected objects; longer-term, verify STOGROUP/SMS policies spread risk appropriately.</p></div>
        <div class="card"><h4>4. Data-sharing member failure</h4>
          <p><strong>Reasoning:</strong> Data isn't lost — other members continue serving all data (Module 25). Focus shifts to restarting the failed member cleanly, using group restart processing and light/deferred restart concepts as appropriate, and confirming no orphaned locks/retained locks are blocking access from surviving members.</p></div>
        <div class="card"><h4>5. Archive log problem (missing/damaged archive log needed for recovery)</h4>
          <p><strong>Reasoning:</strong> Check BSDS log inventory for alternate copies (duplexed logs), offsite/backup copies per retention policy. If truly unavailable, recovery may be limited to the most recent point covered by available logs/copies — a hard conversation with the business about achievable recovery point.</p></div>
        <div class="card"><h4>6. Subsystem restart after an unplanned outage</h4>
          <p><strong>Reasoning:</strong> Restart recovery (Module 14) automatically reconciles in-flight work using logs/BSDS checkpoint data. DBA's role is monitoring restart progress and investigating why the outage happened, not manually replaying logs.</p></div>
        <div class="card"><h4>7. Site disaster (whole data center lost)</h4>
          <p><strong>Reasoning:</strong> This is where Module 26's GDPS/cross-site strategy is exercised — recovery point/time objectives (RPO/RTO) determine which pre-established cross-site solution activates, and the DBA's role is validating the recovered environment's data consistency, not designing the DR architecture on the fly.</p></div>
      </div>`,
    visual:`<div class="diagram"><div class="box-tree">SYMPTOM → SCOPE → EVIDENCE → HYPOTHESIS → TEST → ACTION → VALIDATION → ROOT CAUSE</div></div>`,
    example:"For scenario 1 (accidental DROP), the DBA's first message to stakeholders states the achievable recovery point (based on image copy + log availability) BEFORE starting RECOVER — setting expectations is part of the incident response, not an afterthought.",
    handsOn:"Pick scenario 5 (archive log problem) and write out, in your own words, what you would tell a business stakeholder about the achievable recovery point if the needed archive log truly cannot be found, and what preventive measure (e.g., log duplexing, offsite copy policy) you'd recommend afterward.",
    trap:"Don't skip the 'scope' step under pressure. A failed DASD volume or a corrupted table space can affect far more objects than the one users first reported — always establish full scope before committing to a recovery action plan.",
    remember:[
      "Always establish scope before acting — one symptom can hide a much wider blast radius.",
      "State the achievable recovery point to stakeholders before executing recovery, not after.",
      "Data-sharing member failure ≠ data loss — availability continues via surviving members.",
      "Restart recovery after an unplanned outage is largely automatic; the DBA's job is monitoring and root-causing, not manual log replay.",
      "Site disasters are handled by pre-established cross-site strategy (Module 26), not improvisation."
    ],
    check:[
      {q:"After an accidental DROP TABLE, what should the DBA communicate to stakeholders before starting recovery?", options:["Nothing, just start recovering immediately","The achievable recovery point based on image copy/log availability","That data is permanently lost regardless","That RACF caused the problem"], answer:1, explain:"Setting expectations about the achievable recovery point is part of responsible incident handling."},
      {q:"When a data-sharing member fails, what happens to data availability?", options:["All data becomes unavailable","Surviving members continue serving all data since it isn't partitioned by member","Only that member's data is lost permanently","Data sharing prevents all failures"], answer:1, explain:"Because members share access to all data, the group continues operating through surviving members."},
      {q:"What is the first step in the troubleshooting framework applied to a recovery incident?", options:["Action","Root cause","Symptom and scope","Validation"], answer:2, explain:"The framework starts with symptom and establishing scope before jumping to action."}
    ],
    deep:"", sources:[["IBM Documentation — Db2 for z/OS Backup and recovery","https://www.ibm.com/docs/en/db2-for-zos"]]
  })]
});
