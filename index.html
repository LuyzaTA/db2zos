<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Db2 for z/OS — From Senior LUW DBA to IBM Z DBA</title>
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg:#f5f6f8;
  --bg-elev:#ffffff;
  --bg-sunken:#eceef2;
  --border:#d6dae1;
  --text:#1b2430;
  --text-dim:#5a6472;
  --text-faint:#8891a0;
  --accent:#0b5cab;
  --accent-ink:#ffffff;
  --accent-soft:#e6f0fb;
  --green-bg:#e5f6ea;   --green-ink:#1a7431; --green-bd:#a9dcb6;
  --yellow-bg:#fff6e0;  --yellow-ink:#8a5a00; --yellow-bd:#f0d68a;
  --red-bg:#fdeceb;     --red-ink:#a3231a;   --red-bd:#f2b8b2;
  --code-bg:#101820;
  --code-ink:#d7e3f0;
  --code-accent:#6fd0ff;
  --focus-ring:#0b5cab;
  --radius:10px;
  --radius-sm:6px;
  --shadow:0 1px 3px rgba(20,30,45,.08), 0 1px 2px rgba(20,30,45,.06);
  --shadow-lg:0 8px 24px rgba(20,30,45,.14);
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  --maxw: 980px;
}
html[data-theme="dark"]{
  --bg:#10151c;
  --bg-elev:#171e28;
  --bg-sunken:#0d1218;
  --border:#2a3442;
  --text:#e7ecf3;
  --text-dim:#a8b3c2;
  --text-faint:#71808f;
  --accent:#5fb2ff;
  --accent-ink:#08131f;
  --accent-soft:#132a3f;
  --green-bg:#0f2b18;  --green-ink:#7fdc9a; --green-bd:#1e5c33;
  --yellow-bg:#2c2408; --yellow-ink:#f0c96a; --yellow-bd:#6b551a;
  --red-bg:#301213;    --red-ink:#f6a29a;   --red-bd:#6e2a26;
  --code-bg:#0a0e13;
  --code-ink:#d7e3f0;
  --shadow:0 1px 3px rgba(0,0,0,.35);
  --shadow-lg:0 12px 30px rgba(0,0,0,.5);
}
html[data-contrast="high"]{
  --border:#000000;
  --text-dim:var(--text);
}
html[data-theme="dark"][data-contrast="high"]{
  --border:#ffffff;
}
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-ui); line-height:1.55;
  font-size: calc(15px * var(--fs-scale, 1));
}
html[data-motion="reduced"] *{ animation:none !important; transition:none !important; scroll-behavior:auto !important; }
a{color:var(--accent);}
button{font-family:inherit;}
:focus-visible{ outline:3px solid var(--focus-ring); outline-offset:2px; }
h1,h2,h3,h4{ line-height:1.25; }
code, pre, .mono{ font-family:var(--font-mono); }
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.skip-link{position:absolute;left:8px;top:-60px;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:var(--radius-sm);z-index:999;transition:top .15s;}
.skip-link:focus{top:8px;}

/* ============================================================
   APP SHELL
   ============================================================ */
#app{ display:grid; grid-template-columns:270px 1fr; grid-template-rows:56px 1fr; grid-template-areas:"topbar topbar" "sidebar main"; min-height:100vh; }
@media (max-width: 880px){ #app{ grid-template-columns:1fr; grid-template-areas:"topbar" "main"; } #sidebar{ position:fixed; z-index:60; top:56px; bottom:0; left:0; width:280px; transform:translateX(-100%); transition:transform .18s ease; box-shadow:var(--shadow-lg);} #sidebar.open{transform:translateX(0);} }

#topbar{
  grid-area:topbar; display:flex; align-items:center; gap:10px;
  background:var(--bg-elev); border-bottom:1px solid var(--border);
  padding:0 14px; position:sticky; top:0; z-index:50;
}
#topbar .brand{ display:flex; align-items:center; gap:8px; font-weight:700; letter-spacing:.2px; white-space:nowrap; cursor:pointer; background:none; border:none; color:var(--text); font-size:14px;}
#topbar .brand .z{ display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:6px; background:var(--accent); color:var(--accent-ink); font-weight:800; font-size:13px;}
#topbar .spacer{flex:1;}
.icon-btn{ background:transparent; border:1px solid var(--border); color:var(--text); border-radius:var(--radius-sm); padding:7px 10px; cursor:pointer; font-size:13px; display:inline-flex; align-items:center; gap:6px;}
.icon-btn:hover{ background:var(--bg-sunken); }
#menuToggle{ display:none; }
@media (max-width:880px){ #menuToggle{ display:inline-flex; } }

#sidebar{
  grid-area:sidebar; background:var(--bg-elev); border-right:1px solid var(--border);
  overflow-y:auto; padding:14px 10px 40px;
}
#sidebar nav ul{ list-style:none; margin:0; padding:0; }
#sidebar .navgroup{ margin-bottom:4px; }
#sidebar .navgroup-title{ font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-faint); padding:14px 10px 6px; font-weight:700; }
#sidebar a.navlink, #sidebar button.navlink{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left; text-decoration:none;
  color:var(--text-dim); background:transparent; border:none; padding:8px 10px; border-radius:var(--radius-sm);
  font-size:13.5px; cursor:pointer;
}
#sidebar a.navlink:hover, #sidebar button.navlink:hover{ background:var(--bg-sunken); color:var(--text); }
#sidebar a.navlink.active{ background:var(--accent-soft); color:var(--accent); font-weight:600; }
#sidebar .modnum{ font-variant-numeric:tabular-nums; font-size:11px; color:var(--text-faint); width:22px; flex:none;}
#sidebar .navlink .dot{ width:7px; height:7px; border-radius:50%; background:var(--border); flex:none; }
#sidebar .navlink .dot.done{ background:var(--green-ink); }
#sidebar .navlink .dot.progress{ background:var(--yellow-ink); }

#main{ grid-area:main; padding:26px 22px 80px; }
.page{ max-width:var(--maxw); margin:0 auto; }
.page-wide{ max-width:1180px; margin:0 auto; }

/* ============================================================
   GENERIC COMPONENTS
   ============================================================ */
.card{ background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); }
.card + .card{ margin-top:14px; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
@media (max-width:760px){ .grid2,.grid3{ grid-template-columns:1fr; } }
.badge{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; letter-spacing:.3px; text-transform:uppercase; }
.badge-core{ background:var(--accent-soft); color:var(--accent); }
.badge-dba{ background:var(--yellow-bg); color:var(--yellow-ink); border:1px solid var(--yellow-bd); }
.badge-expert{ background:var(--red-bg); color:var(--red-ink); border:1px solid var(--red-bd); }
.badge-green{ background:var(--green-bg); color:var(--green-ink); border:1px solid var(--green-bd);}
.pill-btn{ background:var(--accent); color:var(--accent-ink); border:none; padding:10px 18px; border-radius:999px; font-weight:700; font-size:13.5px; cursor:pointer; }
.pill-btn.secondary{ background:transparent; color:var(--accent); border:1.5px solid var(--accent); }
.pill-btn:hover{ filter:brightness(1.08); }
.btnrow{ display:flex; gap:10px; flex-wrap:wrap; }
hr.sep{ border:none; border-top:1px solid var(--border); margin:18px 0; }

table{ width:100%; border-collapse:collapse; font-size:13.5px; }
th,td{ text-align:left; padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
th{ color:var(--text-dim); font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.3px; }
.table-scroll{ overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); }
.table-scroll table{ min-width:640px; }

.tag-luw{ background:var(--green-bg); color:var(--green-ink); border:1px solid var(--green-bd); padding:2px 8px; border-radius:6px; font-size:11px; font-weight:700; }
.tag-mod{ background:var(--yellow-bg); color:var(--yellow-ink); border:1px solid var(--yellow-bd); padding:2px 8px; border-radius:6px; font-size:11px; font-weight:700; }
.tag-new{ background:var(--red-bg); color:var(--red-ink); border:1px solid var(--red-bd); padding:2px 8px; border-radius:6px; font-size:11px; font-weight:700; }

.progressbar{ background:var(--bg-sunken); border-radius:999px; height:9px; overflow:hidden; border:1px solid var(--border); }
.progressbar > span{ display:block; height:100%; background:var(--accent); border-radius:999px; }
.proglist .progrow{ display:grid; grid-template-columns:160px 1fr 44px; gap:10px; align-items:center; margin:9px 0; font-size:13px;}
.proglist .progrow .label{ color:var(--text-dim); }
.proglist .progrow .pct{ text-align:right; font-variant-numeric:tabular-nums; color:var(--text-dim); }

.callout{ border-left:4px solid var(--accent); background:var(--accent-soft); padding:12px 14px; border-radius:0 var(--radius-sm) var(--radius-sm) 0; margin:14px 0; font-size:13.8px;}
.callout.trap{ border-color:var(--yellow-ink); background:var(--yellow-bg); color:var(--yellow-ink); }
.callout.trap b, .callout.trap strong{ color:var(--yellow-ink); }
.callout.sim{ border-color:var(--red-ink); background:var(--red-bg); color:var(--red-ink); font-weight:700; }

details.deep{ border:1px dashed var(--border); border-radius:var(--radius-sm); padding:10px 14px; margin:12px 0; background:var(--bg-sunken); }
details.deep summary{ cursor:pointer; font-weight:700; color:var(--text); font-size:13.5px; }
details.deep[open] summary{ margin-bottom:8px; }

.diagram{ background:var(--bg-sunken); border:1px solid var(--border); border-radius:var(--radius); padding:16px; overflow-x:auto; }
.flow{ display:flex; flex-direction:column; align-items:center; gap:4px; font-family:var(--font-mono); font-size:13px; }
.flow .box{ background:var(--bg-elev); border:1.5px solid var(--accent); color:var(--text); padding:8px 16px; border-radius:var(--radius-sm); min-width:180px; text-align:center; }
.flow .arrow{ color:var(--text-faint); }
.box-tree{ font-family:var(--font-mono); font-size:13px; white-space:pre; line-height:1.6; color:var(--text-dim); }
.box-tree .hl{ color:var(--accent); font-weight:700; }

.clickmap{ display:grid; gap:8px; }
.clicknode{ border:1.5px solid var(--border); background:var(--bg-elev); border-radius:var(--radius-sm); padding:10px 12px; cursor:pointer; text-align:left; font-size:13px; color:var(--text); }
.clicknode:hover{ border-color:var(--accent); }
.clicknode.active{ border-color:var(--accent); background:var(--accent-soft); }
.clicknode .t{ font-weight:700; display:block; }
.clicknode .d{ font-size:12px; color:var(--text-dim); display:none; margin-top:6px; }
.clicknode.active .d{ display:block; }

.terminal{ background:var(--code-bg); color:var(--code-ink); border-radius:var(--radius); padding:14px 16px; font-family:var(--font-mono); font-size:13px; overflow-x:auto; }
.terminal .accent{ color:var(--code-accent); }
.term-input-row{ display:flex; gap:8px; margin-top:10px; }
.term-input-row input{ flex:1; background:#000; color:var(--code-ink); border:1px solid #33414f; border-radius:var(--radius-sm); padding:9px 10px; font-family:var(--font-mono); font-size:13px; }
.term-input-row button{ background:var(--accent); color:var(--accent-ink); border:none; border-radius:var(--radius-sm); padding:9px 16px; font-weight:700; cursor:pointer;}

textarea.jclbox{ width:100%; min-height:260px; background:var(--code-bg); color:var(--code-ink); font-family:var(--font-mono); font-size:13px; border-radius:var(--radius); border:1px solid var(--border); padding:14px; resize:vertical; line-height:1.6;}

.quiz-q{ margin:16px 0; padding:14px; border:1px solid var(--border); border-radius:var(--radius-sm); }
.quiz-q .qtext{ font-weight:600; margin-bottom:10px; }
.quiz-opt{ display:flex; align-items:flex-start; gap:8px; padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); margin:6px 0; cursor:pointer; font-size:13.5px;}
.quiz-opt:hover{ background:var(--bg-sunken); }
.quiz-opt.correct{ background:var(--green-bg); border-color:var(--green-bd); }
.quiz-opt.incorrect{ background:var(--red-bg); border-color:var(--red-bd); }
.quiz-explain{ margin-top:10px; font-size:13px; color:var(--text-dim); background:var(--bg-sunken); padding:10px 12px; border-radius:var(--radius-sm); display:none; }
.quiz-explain.show{ display:block; }

input[type=search], input[type=text]{ background:var(--bg-elev); border:1px solid var(--border); color:var(--text); border-radius:var(--radius-sm); padding:9px 12px; font-size:13.5px; width:100%; }
.searchwrap{ position:relative; }

.modal-overlay{ position:fixed; inset:0; background:rgba(10,14,20,.55); display:flex; align-items:flex-start; justify-content:center; padding:6vh 16px; z-index:100; }
.modal-box{ background:var(--bg-elev); border-radius:var(--radius); max-width:720px; width:100%; max-height:85vh; overflow-y:auto; box-shadow:var(--shadow-lg); padding:20px 22px; }
.modal-box h2{ margin-top:0; }
.modal-close{ float:right; background:none; border:none; font-size:20px; color:var(--text-dim); cursor:pointer; }

.chip{ display:inline-block; padding:6px 12px; border-radius:999px; border:1px solid var(--border); background:var(--bg-elev); font-size:12.5px; cursor:pointer; color:var(--text); margin:3px 4px 3px 0;}
.chip.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

.dashboard-hero{ text-align:center; padding:40px 16px 10px; }
.dashboard-hero h1{ font-size:32px; margin:6px 0 6px; }
.dashboard-hero .sub{ color:var(--text-dim); font-size:16px; max-width:620px; margin:0 auto 22px;}
.journey-row{ display:flex; align-items:center; justify-content:center; gap:14px; margin:20px auto; flex-wrap:wrap; max-width:640px;}
.journey-node{ background:var(--bg-elev); border:1.5px solid var(--border); border-radius:var(--radius); padding:12px 18px; text-align:center; font-size:13px; }
.journey-node b{ display:block; font-size:14px; }
.journey-arrow{ color:var(--text-faint); font-size:18px; }
.hero-btns{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:20px 0 6px;}
.est{ color:var(--text-faint); font-size:12.5px; margin-top:16px; }

.modelist{ display:flex; gap:8px; background:var(--bg-sunken); border:1px solid var(--border); padding:4px; border-radius:999px; }
.modelist button{ border:none; background:transparent; padding:7px 14px; border-radius:999px; font-size:12.5px; font-weight:700; color:var(--text-dim); cursor:pointer;}
.modelist button.active{ background:var(--accent); color:var(--accent-ink); }

[data-level="dba"], [data-level="expert"]{ }
html[data-mode="core"] [data-level="dba"], html[data-mode="core"] [data-level="expert"]{ display:none; }
html[data-mode="dba"] [data-level="expert"]{ display:none; }
.levelmark{ font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; padding:2px 7px; border-radius:5px; margin-right:6px;}
.levelmark.dba{ background:var(--yellow-bg); color:var(--yellow-ink); }
.levelmark.expert{ background:var(--red-bg); color:var(--red-ink); }

.breadcrumb{ font-size:12.5px; color:var(--text-faint); margin-bottom:10px; }
.breadcrumb a{ color:var(--text-faint); text-decoration:none; }
.breadcrumb a:hover{ text-decoration:underline; }

.lesson-nav{ display:flex; justify-content:space-between; margin-top:30px; gap:10px; flex-wrap:wrap;}
.lesson-toolbar{ display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 22px; }
.small-btn{ background:var(--bg-elev); border:1px solid var(--border); color:var(--text-dim); padding:6px 11px; border-radius:999px; font-size:12px; cursor:pointer; }
.small-btn.on{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent); font-weight:700; }

footer.pagefoot{ max-width:var(--maxw); margin:50px auto 0; color:var(--text-faint); font-size:12px; text-align:center; }

.kw-list{ display:flex; flex-wrap:wrap; gap:8px; }
.kw-item{ border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; background:var(--bg-elev); font-size:12.5px; min-width:150px;}

.energy-banner{ background:var(--accent-soft); color:var(--accent); border-radius:var(--radius); padding:14px 18px; margin-bottom:18px; font-size:13.5px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}

<div id="app">
  <header id="topbar">
    <button id="menuToggle" class="icon-btn" aria-label="Toggle navigation menu">☰</button>
    <button class="brand" id="brandBtn" title="Go to dashboard"><span class="z">Z</span> Db2 for z/OS Training</span></button>
    <div class="spacer"></div>
    <button class="icon-btn" id="searchBtn" title="Search (glossary, commands, SQLCODEs)">🔎 Search</button>
    <button class="icon-btn" id="themeBtn" title="Toggle dark/light mode">🌓</button>
    <button class="icon-btn" id="a11yBtn" title="Accessibility settings">Aa</button>
  </header>

  <nav id="sidebar" aria-label="Course navigation"></nav>

<script>
/* ==================================================================
   STATE / PERSISTENCE
   ================================================================== */
const STORAGE_KEY = "db2zos_training_state_v1";
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    theme: (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? "dark" : "light",
    mode: "core",
    fontScale: 1,
    contrast: "normal",
    motion: "normal",
    lowEnergy: false,
    completedLessons: {},
    lessonNotes: {},          // lessonId -> 'mastered' | 'review' | 'confusing'
    quizResults: {},          // quizId -> {score,total,ts}
    diagnostic: null,
    finalAssessment: null,
    bookmarks: {},
    lastLesson: null
  };
}
let STATE = loadState();
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }

function applyTheme(){
  document.documentElement.setAttribute("data-theme", STATE.theme);
  document.documentElement.setAttribute("data-mode", STATE.mode);
  document.documentElement.setAttribute("data-contrast", STATE.contrast);
  document.documentElement.setAttribute("data-motion", STATE.motion);
  document.documentElement.style.setProperty("--fs-scale", STATE.fontScale);
}
applyTheme();

/* ==================================================================
   COURSE DATA MODEL
   ================================================================== */
const LEVELS = { foundation:"Foundation", core:"Core Transition", deep:"DBA Deep Dive", lab:"Hands-on Lab", capstone:"Capstone" };

/* Helper to build a standard lesson object following the pedagogical template. */
function L(o){ return Object.assign({
  why:"", luw:null, concept:"", visual:"", example:"", handsOn:"", trap:"",
  remember:[], check:[], deep:"", sources:[]
}, o); }

const COURSE = { modules: [] };

/* ---------- MODULE 0 ---------- */
COURSE.modules.push({
  id:"m00", num:"00", title:"You Already Know Db2", level:"foundation",
  blurb:"Orientation: what carries over from Db2 LUW, what this course adds, and how to pace yourself.",
  lessons:[ L({
    id:"m00-l1", title:"Orientation & Learning Strategy",
    why:"Starting a new platform without a map wastes energy on the wrong things. This lesson sets expectations so every later module has a place to land.",
    luw:{ know:"You already understand relational theory, SQL, transactions, locking, buffer pools, logging, backup/recovery, indexes, optimizers, and production DBA work — deeply, from Db2 LUW.",
          changes:"The database engine's SQL and relational concepts barely change. What changes almost completely is the operating environment underneath it: z/OS instead of Linux/Unix/Windows, datasets instead of a filesystem, JCL instead of shell scripts, an operator console instead of a shell prompt, and an operational culture built around continuous availability of shared subsystems rather than independently started instances.",
          why:"IBM Z and z/OS were designed in the 1960s–70s for a different problem than Unix: maximum reliability, backward compatibility across decades, and massive shared multi-tenant workloads on a single physical machine. Db2 for z/OS was built inside that world, so its administration model inherited z/OS's dataset-oriented, address-space-oriented, operator-command-oriented design." },
    concept:`<p>This course is built on one idea, repeated deliberately throughout: <strong>you are not learning databases again</strong>. You are learning a different operating environment, execution model, storage model, and operational model around a database technology you already understand extremely well.</p>
      <p>Concretely, here is the split:</p>
      <div class="grid2">
        <div class="card"><h4>Stays mostly the same</h4><ul>
          <li>SQL language and relational semantics</li>
          <li>Transactions, isolation, and locking theory</li>
          <li>Indexes, statistics, and cost-based optimization concepts</li>
          <li>Backup / log / recover reasoning at a conceptual level</li>
          <li>DBA instincts: read symptoms → gather evidence → hypothesize → act</li>
        </ul></div>
        <div class="card"><h4>Genuinely new</h4><ul>
          <li>z/OS as an operating system: address spaces, datasets, JCL, JES</li>
          <li>TSO/ISPF as the traditional interactive interface</li>
          <li>A Db2 <em>subsystem</em> as a set of started tasks, not a process/instance</li>
          <li>Packages, collections, and plans (no direct LUW equivalent)</li>
          <li>Data sharing / Parallel Sysplex as the native HA architecture</li>
        </ul></div>

COURSE.modules.push({
  id:"m01", num:"01", title:"The History of Mainframes", level:"foundation",
  blurb:"Why IBM Z exists, why it survived, and why Db2 for z/OS's design choices make sense in context.",
  lessons:[ L({
    id:"m01-l1", title:"From Punched Cards to IBM Z",
    why:"Db2 for z/OS's design decisions (datasets, address spaces, backward compatibility, operator-driven operations) look strange until you see the 60-year engineering lineage that produced them. Once you see the timeline, the platform stops looking arbitrary.",
    luw:{ know:"Linux/Unix systems you've run Db2 LUW on trace their design lineage to 1970s Unix — built around processes, files, and a philosophy of small composable tools.",
          changes:"IBM Z traces its lineage to the System/360 (1964) — built around a single, unifying architecture designed to run the same programs, unmodified, for decades, at extreme reliability, across an enormous range of machine sizes.",
          why:"Both lineages solved real problems well for their era. Unix optimized for flexibility and openness. System/360 and its descendants optimized for continuity, reliability, and running mixed, mission-critical workloads on shared hardware without downtime." },
    concept:`<p>Timeline of the architecture Db2 for z/OS runs on:</p>
      <div class="table-scroll"><table><tr><th>Era</th><th>Milestone</th><th>Why it matters to a DBA today</th></tr>
      <tr><td>1950s</td><td>Punched cards, batch processing</td><td>JCL's batch-job mental model traces directly back to this era — a "job" is still the unit of work.</td></tr>
      <tr><td>1964</td><td>IBM System/360</td><td>Introduced a single instruction-set architecture spanning small to large machines, and the idea that programs should keep running unmodified for decades. This is why Db2 utilities and JCL written years ago often still run today.</td></tr>
      <tr><td>1970</td><td>System/370</td><td>Added virtual memory — the ancestor of today's address spaces, which every Db2 subsystem component (DBM1, MSTR, IRLM, DIST) still runs inside.</td></tr>
      <tr><td>1990</td><td>System/390 (ESA/390)</td><td>Introduced Parallel Sysplex — the clustering technology underneath Db2 data sharing.</td></tr>
      <tr><td>2000</td><td>zSeries / z/Architecture</td><td>64-bit addressing arrives, enabling the huge buffer pools and memory structures modern Db2 for z/OS uses.</td></tr>
      <tr><td>2005–today</td><td>System z → IBM Z</td><td>Continued investment in specialty engines, pervasive encryption, AI acceleration, and hybrid cloud integration (Zowe, REST, Linux on Z), while preserving backward compatibility.</td></tr>
      </table></div>
      <h4>Why mainframes still matter</h4>
      <p>IBM Z is not a legacy curiosity — it is the system of record for a large share of global banking, insurance, payments, airline reservations, and government transaction processing. Organizations keep Db2 for z/OS in production because of:</p>
      <ul><li><strong>Reliability</strong> — designed for continuous operation measured in years between planned outages.</li>
      <li><strong>Massive shared I/O and transaction throughput</strong> — purpose-built I/O subsystems (channels) independent of the general CPU.</li>
      <li><strong>Backward compatibility</strong> — code and JCL written decades ago can still run, protecting enormous investments in business logic.</li>
      <li><strong>Security and auditability</strong> — RACF, pervasive encryption, and decades of hardened isolation between workloads.</li>
      <li><strong>Vertical + horizontal scale</strong> — a single LPAR can scale up, and Parallel Sysplex lets multiple systems scale out while sharing data coherently.</li></ul>`,
    visual:`<div class="diagram"><div class="box-tree">1950s   Punched cards, batch jobs
1964    System/360  ─┐ single architecture, decades of compatibility
1970    System/370   │ virtual storage → address spaces
1990    System/390   │ Parallel Sysplex → data sharing
2000    zSeries       │ 64-bit z/Architecture
2005+   System z → IBM Z ─┘ specialty engines, encryption, hybrid cloud
                          │
                          ▼
                    Db2 for z/OS today</div></div>`,
    example:"A bank's core ledger system, originally written in the 1980s, can still run on current IBM Z hardware with minimal changes — the same COBOL/JCL, now calling modern Db2 for z/OS, benefiting from decades of hardware and software improvement without a rewrite. This continuity is precisely why so much of world banking still runs here.",
    handsOn:"List three systems you interact with daily (banking app, airline booking, insurance claim, retail purchase) that are plausibly backed by a mainframe. For each, identify why continuous availability would matter to that business.",
    trap:"Assuming 'mainframe' means 'outdated technology.' Modern IBM Z hardware (as of Db2 13 era systems) supports AI inferencing, pervasive encryption, container workloads (Linux on Z), and REST APIs — it is not frozen in the 1970s, even though its architecture preserves compatibility back to that era.",
    remember:[
      "IBM Z's lineage (System/360 → IBM Z) optimized for reliability and backward compatibility, not just raw flexibility.",
      "Address spaces (used by every Db2 started task) descend from System/370 virtual storage.",
      "Parallel Sysplex, the base for Db2 data sharing, originated with System/390.",
      "Mainframes remain the system of record for banking, insurance, government, and airline workloads.",
      "Backward compatibility is a deliberate design goal, not neglect."
    ],
    check:[
      {q:"What key architectural idea did the System/360 (1964) introduce that still shapes Db2 for z/OS today?", options:["Object-oriented programming","A single architecture spanning machine sizes with long-term compatibility","Cloud-native container orchestration","The relational data model"], answer:1, explain:"System/360 introduced a unifying architecture designed for decades of compatibility — the reason old JCL and programs still run today."},
      {q:"Parallel Sysplex, the foundation for Db2 data sharing, was introduced with which era?", options:["System/360 (1964)","System/390 / ESA/390 (1990)","zSeries (2000)","Linux on Z"], answer:1, explain:"Parallel Sysplex clustering originated with System/390 in 1990."},
      {q:"Why do many banks and insurers still run core systems on IBM Z?", options:["It's the cheapest hardware available","Reliability, throughput, security, and preservation of decades of business logic investment","There is no alternative technology","Regulatory law requires mainframes"], answer:1, explain:"The combination of reliability, throughput, security, and backward compatibility keeps mission-critical workloads on the platform."}
    ],
    deep:`<p data-level="expert"><span class="levelmark expert">Expert</span> Modern IBM Z generations (Db2 13 for z/OS era) include on-chip AI acceleration, pervasive encryption applied transparently to data at rest, and Telum-generation processor designs emphasizing large cache hierarchies for transaction-heavy workloads like Db2. Verify current generation specifics against IBM Z hardware documentation, as this evolves with each hardware cycle.</p>`,
    sources:[["IBM Z — Products","https://www.ibm.com/z"],["IBM Z Xplore","https://ibmzxplore.ibm.com/"],["IBM Redbooks","https://www.redbooks.ibm.com"]]
  })]
});

COURSE.modules.push({
  id:"m02", num:"02", title:"IBM Z Architecture", level:"foundation",
  blurb:"CPUs, memory, channels, DASD, LPARs, PR/SM, z/VM, and where z/OS and Db2 sit on the physical machine.",
  lessons:[ L({
    id:"m02-l1", title:"From Physical Machine to Db2 Subsystem",
    why:"Every Db2 for z/OS performance and availability conversation eventually touches the layers below z/OS itself — LPARs, real/virtual storage, and I/O paths. Understanding the stack prevents confusing 'subsystem' with 'server' or 'LPAR' with 'VM.'",
    luw:{ know:"In LUW you're used to an instance running on a physical or virtual server (or a VM/container), with the OS directly owning the hardware or being one guest among several under a hypervisor like VMware/KVM.",
          changes:"On IBM Z, a single physical machine is routinely divided by firmware-level virtualization (PR/SM) into multiple LPARs, each running its own copy of z/OS (or z/VM, or Linux on Z). A Db2 subsystem runs inside one z/OS LPAR — conceptually closer to 'an application/instance running inside one VM' than to 'a database server owning a whole machine.'",
          why:"IBM Z hardware is designed to safely and efficiently share one very large, very reliable physical machine among many independent, isolated workloads — an idea that predates x86 hypervisors by decades (PR/SM shipped in the 1980s)." },
    concept:`<p>The physical-to-logical stack, top to bottom as a DBA needs to know it:</p>
      <ul>
        <li><strong>IBM Z hardware</strong> — CPUs (general-purpose + optional specialty engines like zIIP), central storage (real memory), and channels (dedicated I/O processors that move data to/from DASD independently of the CPU — a major difference from typical x86 I/O paths).</li>
        <li><strong>PR/SM (Processor Resource/Systems Manager)</strong> — firmware-level hypervisor that divides the physical machine into LPARs (Logical Partitions), each with its own allocation of CPU, memory, and I/O.</li>
        <li><strong>LPAR</strong> — a logical partition, each running one operating system image: z/OS, z/VM, or Linux on Z.</li>
        <li><strong>z/OS</strong> — the operating system a Db2 subsystem runs under. One LPAR typically runs one z/OS image.</li>
        <li><strong>z/VM</strong> (optional layer) — a second-level hypervisor, often used to run many Linux on Z guests inside one LPAR; not typically where a Db2 for z/OS subsystem itself lives, but you'll encounter it in mixed environments.</li>
        <li><strong>Db2 subsystem</strong> — runs as a set of started tasks (address spaces) inside one z/OS image.</li>
      </ul>
      <p><strong>DASD</strong> (Direct Access Storage Device) is the traditional term for the disk storage that holds z/OS datasets, including Db2's VSAM-based table spaces and indexes, logs, and the BSDS. Modern DASD is typically enterprise storage (e.g. IBM DS8000-class) presented through the same architecture. <strong>Channels</strong> are dedicated I/O processors — this is why mainframe I/O throughput scales differently than typical server-attached storage: I/O work is offloaded from the general CPU.</p>`,
    visual:`<div class="diagram"><div class="box-tree">Physical IBM Z machine
   │
   ├─ CPUs (general purpose + optional zIIP/specialty engines)
   ├─ Central storage (real memory)
   └─ Channels ──► DASD / tape / network

            PR/SM  (firmware hypervisor)
        ┌──────────────┼──────────────┐
      LPAR1           LPAR2          LPAR3
      z/OS            z/OS           z/VM
        │               │              │
     <span class="hl">Db2 subsystem</span>    Db2 subsystem   Linux on Z guests</div></div>`,
    example:"A production sysplex might run four LPARs on one or more physical IBM Z machines: two hosting a data-sharing Db2 group for OLTP, one hosting batch, and one hosting Linux on Z guests for a modernization workload — all sharing the same physical hardware safely via PR/SM, with workloads isolated from each other.",
    handsOn:"Draw (on paper or in your head) the chain from 'a SQL statement executing' down to 'physical DASD.' Label each layer: application → Db2 subsystem → z/OS LPAR → PR/SM → physical IBM Z → channel → DASD.",
    trap:"Do not equate an LPAR with a 'VM' in the VMware sense, and do not equate a Db2 'subsystem' with an LPAR. An LPAR is a hardware-level partition running one full OS image; a Db2 subsystem is software running as started tasks inside one z/OS image. Multiple Db2 subsystems can run in the same LPAR.",
    remember:[
      "PR/SM divides one physical IBM Z machine into LPARs at the firmware level.",
      "Each LPAR runs one OS image: z/OS, z/VM, or Linux on Z.",
      "A Db2 subsystem runs as started tasks inside one z/OS LPAR — it is not itself an LPAR or a VM.",
      "Channels are dedicated I/O processors, offloading I/O work from the general CPU — a structural difference from typical server I/O paths.",
      "Multiple Db2 subsystems can coexist in one LPAR; a data-sharing group spans subsystems across LPARs."
    ],
    check:[
      {q:"What is the correct relationship between an LPAR and a Db2 subsystem?", options:["They are the same thing","A Db2 subsystem is a set of started tasks running inside one z/OS LPAR","An LPAR runs inside a Db2 subsystem","A Db2 subsystem always spans all LPARs on a machine"], answer:1, explain:"An LPAR is a hardware-level partition running an OS image; a Db2 subsystem runs as started tasks within that OS image."},
      {q:"What does PR/SM do?", options:["Manages Db2 buffer pools","Divides a physical IBM Z machine into LPARs at the firmware level","Compiles SQL access paths","Encrypts DASD volumes"], answer:1, explain:"PR/SM is the firmware-level hypervisor that creates and manages LPARs."},
      {q:"What structurally differs about mainframe I/O compared to typical server-attached storage?", options:["Mainframes don't support disk storage","Dedicated channels offload I/O processing from the general CPU","I/O is handled entirely in application code","There is no equivalent of DASD"], answer:1, explain:"Channels are dedicated I/O processors, a long-standing architectural difference from typical x86 server I/O."}
    ],
    deep:`<p data-level="dba"><span class="levelmark dba">DBA</span> zIIP specialty engines can offload eligible Db2 workload (e.g., portions of DDF-driven distributed processing, some utility and parallel query processing) from general-purpose CPUs, which has direct cost and capacity-planning implications. Which workloads are zIIP-eligible is version- and configuration-dependent — verify against current IBM documentation.</p>`,
    sources:[["IBM Z hardware documentation","https://www.ibm.com/docs/en/zos"],["IBM Z Xplore","https://ibmzxplore.ibm.com/"]]
  })]
});

COURSE.modules.push({
  id:"m03", num:"03", title:"z/OS Fundamentals", level:"foundation",
  blurb:"Address spaces, datasets, catalogs, VSAM, USS, and the vocabulary every later module depends on.",
  lessons:[ L({
    id:"m03-l1", title:"z/OS Building Blocks for a DBA",
    why:"Every Db2 concept later in this course — the catalog, table spaces, logs, the BSDS, utility JCL — is expressed in terms of z/OS datasets and address spaces. Without this vocabulary, later modules will feel like memorization instead of understanding.",
    luw:{ know:"In Linux, a Db2 LUW instance runs as OS processes, storing data in files inside a hierarchical filesystem (/home, /data, etc.), with a package manager and shell for administration.",
          changes:"z/OS has no single hierarchical filesystem for its native workloads (though USS — Unix System Services — provides a POSIX filesystem layer alongside it). Instead, storage is organized into datasets, cataloged by name, sitting on DASD volumes. Db2's started tasks are address spaces, not processes in the Unix sense (though conceptually related).",
          why:"z/OS predates Unix-style hierarchical filesystems and was built around datasets as first-class, catalog-managed objects with rich attributes (record format, block size, allocation) because early mainframe workloads needed precise control over storage on expensive, limited DASD." },
    concept:`<p>Key z/OS building blocks, each with its LUW translation and where the analogy breaks:</p>
      <div class="table-scroll"><table>
      <tr><th>z/OS concept</th><th>What it is</th><th>Closest LUW/Linux analogy</th><th>Where the analogy breaks</th></tr>
      <tr><td>Address space</td><td>An isolated virtual memory space running one program/task (e.g., a Db2 started task like DBM1)</td><td>A process</td><td>Address spaces have a much larger, more rigid virtual storage layout (below/above the line/bar) that DBAs must reason about for large memory structures.</td></tr>
      <tr><td>Dataset</td><td>A named, cataloged unit of stored data on DASD, with defined attributes (record format, block size, organization)</td><td>A file</td><td>No hierarchical path; datasets are named and located via the system catalog, not directory traversal. Many dataset organizations (VSAM, PDS) have no direct file equivalent.</td></tr>
      <tr><td>Catalog (master/user)</td><td>System-managed directory mapping dataset names to volumes</td><td>A filesystem's directory metadata</td><td>Catalog entries are managed by explicit utilities, not implicit path creation.</td></tr>
      <tr><td>VTOC</td><td>Volume Table of Contents — per-volume index of datasets residing on that DASD volume</td><td>A disk partition table / inode table</td><td>Operates per physical volume, one layer below the catalog.</td></tr>
      <tr><td>VSAM</td><td>Virtual Storage Access Method — a dataset organization supporting keyed/indexed access; Db2 table spaces and indexes are implemented as VSAM linear datasets (LDS)</td><td>Roughly analogous to how a storage engine organizes files on disk, but exposed as a first-class OS access method</td><td>VSAM is a general-purpose z/OS access method used by many products, not Db2-specific.</td></tr>
      <tr><td>Sequential dataset (PS)</td><td>Records stored and read sequentially</td><td>A flat file</td><td>Fixed/variable record formats and block sizes must be defined explicitly at allocation.</td></tr>
      <tr><td>Partitioned dataset (PDS/PDSE)</td><td>A dataset containing named "members" — like a simple archive of small files</td><td>A directory of small text files (e.g., a library of scripts)</td><td>Members are accessed by name within one dataset, not via nested subdirectories.</td></tr>
      <tr><td>USS (Unix System Services)</td><td>A POSIX-compliant filesystem and shell environment running inside z/OS</td><td>A real Linux filesystem/shell</td><td>USS coexists with, but is architecturally separate from, traditional dataset-based z/OS storage. Db2 core datasets are NOT stored in USS.</td></tr>
      </table></div>`,
    visual:`<div class="diagram"><div class="box-tree">z/OS
  ├─ Address spaces      (running programs, e.g. Db2's DBM1, MSTR, IRLM)
  ├─ Catalog             (dataset name → volume mapping)
  │    └─ VTOC (per volume: what datasets live here)
  ├─ Datasets
  │    ├─ Sequential (PS)
  │    ├─ Partitioned (PDS / PDSE)     ── "members" inside
  │    └─ VSAM (KSDS / ESDS / <span class="hl">LDS</span>)   ── Db2 table spaces & indexes use LDS
  └─ USS (Unix System Services)        ── POSIX filesystem, separate world</div></div>`,
    example:"A DBA asked to 'find where a table space's data physically lives' will look up the table space's underlying VSAM linear dataset name via the Db2 catalog, then use ISPF 3.4 (dataset list) or LISTCAT to find which volume(s) hold it — the rough equivalent of a LUW DBA checking a tablespace container path, but routed entirely through catalog/dataset naming rather than filesystem paths.",
    handsOn:"Given the dataset name pattern DSNC.DSNDBC.PAYDB.PAYTS.I0001.A001, identify which parts look like they encode: catalog prefix, database, table space, and a VSAM component suffix. (This mirrors real Db2-managed VSAM naming conventions — exact conventions can vary by installation standards.)",
    trap:"Do not assume USS is 'where Db2 lives.' Db2 for z/OS's core datasets (table spaces, indexes, logs, BSDS) are traditional MVS/VSAM datasets, not USS files — even though USS exists alongside and is increasingly used for tooling (Zowe, Git, modern language runtimes).",
    remember:[
      "Address spaces ≈ processes, but with a distinct virtual storage model DBAs must understand for memory-heavy structures.",
      "Datasets are catalog-managed named objects, not filesystem paths.",
      "Db2 table spaces and indexes are implemented as VSAM linear datasets (LDS).",
      "PDS/PDSE datasets hold named 'members' — think 'one file containing many small named files.'",
      "USS is a real POSIX layer inside z/OS, but it is architecturally separate from where Db2's core data lives."
    ],
    check:[
      {q:"What z/OS dataset organization underlies Db2 for z/OS table spaces and indexes?", options:["PDS members","Sequential datasets","VSAM linear datasets (LDS)","USS files"], answer:2, explain:"Db2 table spaces and indexes are implemented as VSAM linear datasets."},
      {q:"How are z/OS datasets located, in contrast to Linux files?", options:["By hierarchical path traversal like Linux","By catalog lookup mapping a dataset name to a volume","Only by physical block address entered manually","Datasets cannot be located; they must be memorized"], answer:1, explain:"The system catalog maps dataset names to the volumes where they reside — there's no hierarchical path traversal for classic datasets."},
      {q:"Which statement about USS is accurate?", options:["USS is where Db2's table spaces are stored","USS is a POSIX filesystem/shell layer inside z/OS, separate from where core Db2 datasets live","USS replaced VSAM in modern Db2 versions","USS is only used for JCL"], answer:1, explain:"USS provides a real POSIX environment inside z/OS, used increasingly for tooling, but Db2's core datasets remain in traditional VSAM/MVS datasets."}
    ],
    deep:`<p data-level="dba"><span class="levelmark dba">DBA</span> SMS (Storage Management Subsystem) automates volume selection and dataset attribute assignment for many shops, meaning a DBA today often specifies a storage class/data class rather than a literal volume — see Module 11 for the storage-architecture deep dive.</p>`,
    sources:[["IBM Documentation — z/OS Basic Skills","https://www.ibm.com/docs/en/zos"],["IBM Documentation — DFSMS / VSAM","https://www.ibm.com/docs/en/zos/dfsms"]]
  })]
});

COURSE.modules.push({
  id:"m04", num:"04", title:"TSO and ISPF", level:"foundation",

 Option ===&gt;

 10  SCLM          Software Configuration and Library Manager

ISPF Primary Option Menu

    example:"A DBA needs to check the JCL used for last night's REORG job. They log on to TSO, go to ISPF option 3.4, filter the dataset list for the utility JCL library, locate the member, and open it in Edit (option 2) or Browse (option 1) — the mainframe equivalent of finding and opening a script file, but through catalog-based dataset lists rather than directory browsing.",
    handsOn:"Memorize this minimal survival set: PF3 = exit/back, PF7/PF8 = scroll up/down, PF5 = find next (RFIND), and the primary-menu option numbers for Edit (2), Utilities (3), and Command (6). On your next hands-on lab (Module 30, IBM Z Xplore), practice navigating to a dataset list and opening a member before doing anything else.",
    trap:"Don't expect tab-completion or command history the way a shell provides it. ISPF navigation is panel- and number-driven; efficiency comes from memorizing PF keys and option numbers, not from shell-style autocomplete.",
    remember:[

COURSE.modules.push({
  id:"m05", num:"05", title:"JCL — Job Control Language", level:"core",
  blurb:"JOB/EXEC/DD statements, datasets, DISP, procedures, and writing JCL to run a Db2 utility.",
  lessons:[ L({
    id:"m05-l1", title:"JCL: The Language of Batch Work",
    why:"Nearly every Db2 utility (REORG, RUNSTATS, LOAD, COPY, RECOVER...) is invoked through JCL. You cannot operate as a Db2 for z/OS DBA without being able to read, write, and repair JCL confidently.",
    luw:{ know:"Shell scripts, cron jobs, and CI/CD pipeline definitions that describe a sequence of steps, redirect input/output, and reference files.",
          changes:"JCL statements describe jobs as a rigid, declarative structure: a JOB card (who/what/accounting), one or more EXEC steps (what program or procedure to run), and DD statements (what datasets each step uses, and how). There's no procedural logic like a shell script — it's declarative resource allocation plus program invocation, with condition codes (not exceptions) controlling step flow.",
          why:"JCL was designed to let the operating system pre-allocate all resources (datasets, devices) a job would need before running it, which matters enormously for reliable, predictable batch scheduling on shared, resource-constrained mainframe hardware." },
    concept:`<p>The three core statement types:</p>
      <div class="table-scroll"><table>
      <tr><th>Statement</th><th>Purpose</th><th>Rough shell-script analogy</th></tr>
      <tr><td>JOB</td><td>Identifies the job: accounting info, programmer name, job class, MSGCLASS for output routing</td><td>The shebang line + job scheduler metadata</td></tr>
      <tr><td>EXEC</td><td>Names a program (PGM=) or cataloged procedure (PROC=) to run as one step</td><td>A single command/script invocation</td></tr>
      <tr><td>DD</td><td>Data Definition — declares a dataset or resource used by the step (input, output, sysout), with attributes like DISP, SPACE, DCB</td><td>File redirection (&lt; &gt; &gt;&gt;) plus explicit "create this file with these properties" instructions</td></tr>
      </table></div>
      <p>Key DD parameters:</p>
      <ul>
        <li><strong>DSN</strong> — the dataset name.</li>
        <li><strong>DISP</strong> — disposition: status when the step starts (NEW/OLD/SHR/MOD) and what happens at normal/abnormal end (e.g., DISP=(NEW,CATLG,DELETE)).</li>
        <li><strong>SPACE</strong> — how much DASD space to allocate, in tracks/cylinders or blocks.</li>
        <li><strong>DCB</strong> — Data Control Block attributes: record format (RECFM), logical record length (LRECL), block size (BLKSIZE).</li>
        <li><strong>SYSOUT</strong> — routes output to a spool class instead of a dataset (Module 6, JES).</li>
        <li><strong>SYSIN</strong> — supplies control-statement input (e.g., utility control cards for REORG or RUNSTATS) inline or from a dataset.</li>
      </ul>
      <p>Other important concepts: <strong>temporary datasets</strong> (name starts with &amp;&amp;, exist only for the job's duration — like a shell pipe or /tmp file), <strong>dataset concatenation</strong> (multiple DD statements combined as one logical input), <strong>GDG</strong> (Generation Data Groups — versioned dataset families, e.g. for daily archive logs or extract files), <strong>symbolic parameters</strong> (variables in cataloged procedures), and <strong>return codes</strong> (each step produces a condition code; later steps can be conditioned on COND= or IF/THEN/ELSE logic).</p>`,
    visual:`<div class="diagram"><div class="box-tree">JCL
 │
 ├─ JOB     (job name, accounting, MSGCLASS)
 │
 ├─ EXEC    (PGM= or PROC=, e.g. run DSNUTILB — the Db2 utility driver)
 │     │
 │     └─ DD statements
 │           ├─ STEPLIB   DD  (load library for the program)
 │           ├─ SYSIN     DD  *  (utility control statements, inline)
 │           ├─ SYSPRINT  DD  SYSOUT=*  (messages)
 │           └─ <span class="hl">application DDs</span>  (e.g. the table space's VSAM dataset)</div></div>
      <div class="terminal">//PAYRUN01 JOB (ACCT),'DBA TEAM',CLASS=A,MSGCLASS=X,NOTIFY=&amp;SYSUID
//STEP1    EXEC PGM=DSNUTILB,PARM='DSN1,UTILITY'
//STEPLIB  DD DSN=DSN1010.SDSNLOAD,DISP=SHR
//SYSPRINT DD SYSOUT=*
//SYSIN    DD *
  RUNSTATS TABLESPACE PAYDB.PAYTS TABLE(ALL) INDEX(ALL)
/*</div>`,
    example:"A DBA needs to run RUNSTATS after a large data load finishes. They copy a standard cataloged procedure, change the table space name in the SYSIN control statement, verify DISP=SHR is correct (multiple readers allowed) rather than DISP=OLD (exclusive), and submit the job — very similar in spirit to editing and re-running a maintenance shell script, but every dataset touched must be explicitly declared with DD statements.",
    handsOn:"Given the JCL fragment above, identify: (1) which DD statement supplies the utility control statement, (2) which DD would you change to point to a different table space name, (3) what MSGCLASS=X most likely controls. Then try writing a second SYSIN control statement for a COPY utility run against the same table space (you'll formalize this further in the JCL Lab, Module 34).",
    trap:"The most common LUW-DBA mistake is treating DISP like a mere formality. DISP controls dataset locking and cleanup semantics at the OS level — get it wrong (e.g., DISP=OLD when another job needs concurrent read access) and jobs will hang or abend waiting for a resource, with symptoms that look nothing like a typical file-permission error.",
    remember:[
      "JOB / EXEC / DD are the three core JCL statement types — job, step/program, and dataset declaration.",
      "DISP controls both current-status and end-of-job disposition of a dataset — it's not optional detail.",
      "SYSIN typically carries the actual utility control statements (e.g., what RUNSTATS should operate on).",
      "Db2 utilities are invoked through a common driver program (DSNUTILB) with utility-specific SYSIN control statements.",
      "Return codes (condition codes) — not exceptions — drive step-to-step flow control in JCL."
    ],
    check:[
      {q:"Which JCL statement type declares a dataset a step will use, including its allocation and disposition?", options:["JOB","EXEC","DD","PROC"], answer:2, explain:"The DD (Data Definition) statement declares datasets and their attributes for a step."},
      {q:"What does DISP=SHR typically indicate?", options:["The dataset will be deleted after the step","The dataset can be shared for concurrent read access by other jobs","The dataset is brand new","The step will always abend"], answer:1, explain:"DISP=SHR allows concurrent read access, appropriate when other jobs may also need the dataset."},
      {q:"In a JCL step running a Db2 utility, where do the utility's actual control statements (e.g., which table space to RUNSTATS) usually go?", options:["In the JOB card","In the STEPLIB DD","In the SYSIN DD","They cannot be specified in JCL"], answer:2, explain:"SYSIN typically supplies the utility control statements as inline or dataset input."}
    ],
    deep:`<p data-level="dba"><span class="levelmark dba">DBA</span> Cataloged procedures (PROC) with symbolic parameters let shops standardize utility JCL (e.g., one PROC parameterized by table space name), reducing duplication — conceptually similar to a parameterized script or template, but resolved by JCL PROC/symbolic substitution rather than a scripting language.</p>`,
    sources:[["IBM Documentation — MVS JCL Reference","https://www.ibm.com/docs/en/zos/latest?topic=guides-jcl-reference"]]
  })]
});

COURSE.modules.push({
  id:"m06", num:"06", title:"JES and SDSF", level:"core",
  blurb:"How jobs run: spool, queues, output, and using SDSF to find and interpret job results.",
  lessons:[ L({
    id:"m06-l1", title:"JES2 and SDSF: Where Jobs Go To Run",
    why:"Submitting JCL is only half the job. Every DBA needs to find their job on the spool, read its output, and interpret return codes to know whether a utility actually succeeded.",
    luw:{ know:"A job scheduler or CI/CD pipeline dashboard showing queued/running/completed jobs, with logs you can tail or download.",
          changes:"JES2 (Job Entry Subsystem) is z/OS's job scheduler and spool manager — it queues submitted jobs, manages their execution priority/class, and captures all their output ('spool'). SDSF (System Display and Search Facility) is the interactive tool (reached from ISPF) used to browse that spool: find your job, check its status, and read its output." },
    concept:`<p>Job lifecycle through JES2:</p>
      <ol>
        <li><strong>Input</strong> — job is submitted (via TSO SUBMIT, or programmatically) and queued.</li>
        <li><strong>Conversion/Execution</strong> — JES2 selects the job by class/priority and it runs, producing SYSOUT.</li>
        <li><strong>Output</strong> — all SYSOUT (job log, SYSPRINT from each step, etc.) sits on the spool, viewable and route-able (e.g., to a printer class or held for review).</li>
        <li><strong>Purge</strong> — output is eventually purged per retention rules.</li>
      </ol>
      <p>In SDSF, the key panels a DBA uses constantly:</p>
      <ul>
        <li><strong>ST (Status)</strong> — shows jobs and their status (active, on the queue, or completed with a return code).</li>
        <li><strong>DA (Display Active)</strong> — currently executing jobs/started tasks.</li>
        <li><strong>O (Output)</strong> — completed jobs awaiting output review.</li>
        <li><strong>Return code column</strong> — the fastest way to know success/failure: RC=0000 (success), non-zero RC or ABEND indicates a problem worth investigating in SYSPRINT/JESMSGLG.</li>
      </ul>`,
    visual:`<div class="diagram"><div class="box-tree">Submit JCL
   │
   ▼
JES2 spool  ── queued by job class/priority
   │
   ▼
Job executes  ── produces SYSOUT per DD (SYSPRINT, JESMSGLG, ...)
   │
   ▼
SDSF  ── ST/DA/O panels: find job → check RC → browse SYSOUT
   │
   ▼
Output purged per retention policy</div></div>`,
    example:"A RUNSTATS job appears to have 'disappeared.' The DBA opens SDSF ST, filters by job name/owner, finds it completed with RC=0008 — not the clean RC=0000 expected — and drills into SYSPRINT to find the actual Db2 utility message explaining what went wrong (e.g., an invalid table space name in SYSIN).",
    handsOn:"Practice this diagnostic sequence, which you'll repeat throughout production incidents in Module 32: (1) find the job in SDSF ST, (2) note the return code, (3) open SYSPRINT/JESMSGLG, (4) locate the first error message (not just the last), (5) map the return code to a meaning (0=success, 4=warning, 8=error, 12/16=severe error — exact meaning is utility- and program-specific).",
    trap:"Don't assume 'the job completed' means 'the job succeeded.' A job can complete with a non-zero return code and still show as finished normally in JES — always check the RC, not just completion status.",
    remember:[
      "JES2 queues, executes, and manages spool output for every batch job on the system.",
      "SDSF is the interactive tool for finding jobs and reading their output.",
      "A job 'completing' is not the same as a job 'succeeding' — always check the return code.",
      "SYSPRINT and JESMSGLG are usually your first stops when diagnosing a failure.",
      "Return code severity generally increases with the number (0 clean, 4 warning, 8+ error) but meaning is program-specific."
    ],
    check:[
      {q:"What is SDSF used for?", options:["Writing SQL","Browsing and managing job spool output via ISPF","Compiling COBOL programs","Managing RACF user profiles"], answer:1, explain:"SDSF is the interactive spool display and search facility used to find jobs and read their output."},
      {q:"A job shows as 'completed' in JES. What should you check next before assuming success?", options:["Nothing — completed means successful","The job's return code and SYSPRINT output","The job's submission time only","The operator console color"], answer:1, explain:"Completion status alone doesn't indicate success — the return code and detailed output must be checked."},
      {q:"Which SDSF panel shows currently executing jobs and started tasks?", options:["ST only","DA (Display Active)","O (Output) only","LOG"], answer:1, explain:"DA (Display Active) shows what is currently executing."}
    ],
    deep:"", sources:[["IBM Documentation — JES2","https://www.ibm.com/docs/en/zos/latest?topic=guides-jes2"],["IBM Documentation — SDSF","https://www.ibm.com/docs/en/zos/latest?topic=guides-sdsf"]]
  })]
});

COURSE.modules.push({
  id:"m07", num:"07", title:"RACF and Security Basics", level:"core",
  blurb:"z/OS security fundamentals: user IDs, groups, dataset/resource protection, and where Db2 security connects in.",
  lessons:[ L({
    id:"m07-l1", title:"RACF Fundamentals for a Db2 DBA",
    why:"Db2 privileges (GRANT/REVOKE) are only half the security picture on z/OS. Access to datasets, the ability to start/stop the subsystem, and even connecting to Db2 at all typically depend on RACF (or an equivalent security manager) authorization first.",
    luw:{ know:"OS-level users/groups (e.g., Linux /etc/passwd, sudoers) layered under Db2 LUW's own authentication and authorization (SECADM, database/table GRANTs).",
          changes:"RACF (Resource Access Control Facility) is z/OS's security manager, protecting datasets, started tasks, TSO logon, and — through Db2's external security exit — can also govern Db2 connection and even some administrative authorities. It uses user IDs, groups, and resource profiles rather than Unix-style file permission bits.",
          why:"z/OS security was designed around centralizing authorization decisions for a shared, multi-tenant machine running many products, so all resource types (datasets, started tasks, and product-specific resources) can be governed through one consistent access-control model." },
    concept:`<p>Core RACF concepts:</p>
      <ul>
        <li><strong>User ID</strong> — identifies a person or started task to RACF (a started task like the Db2 MSTR address space runs under its own associated user ID).</li>
        <li><strong>Group</strong> — a way to organize users and assign authority collectively (similar in spirit to Unix groups, but managed through RACF commands, not /etc/group).</li>
        <li><strong>Resource profiles</strong> — RACF protects "resources" (datasets, general resources like Db2's own security classes) via profiles that define who can access them and how (READ/UPDATE/ALTER/etc.).</li>
        <li><strong>Started tasks</strong> — each Db2 address space (MSTR, DBM1, IRLM, DIST) typically runs under an associated RACF user ID/started-task profile, which is what actually authorizes it to open its datasets.</li>
      </ul>
      <p>The layering a DBA needs to keep straight:</p>`,
    visual:`<div class="diagram"><div class="box-tree">User (TSO logon / batch job / DDF connection)
   │
   ▼
RACF   ── authenticates identity, authorizes z/OS-level resources
   │        (datasets, started tasks, can also drive Db2 connect authority)
   ▼
z/OS   ── the OS layer RACF protects
   │
   ▼
Db2 subsystem   ── once connected, Db2's OWN privilege model takes over
   │                 (GRANT/REVOKE on tables, plans, packages, etc.)
   ▼
Database-level privileges</div></div>`,
    example:"A new DBA can query a table via SPUFI but their batch job fails allocating the Db2 load library with a security violation. The issue is at the RACF/dataset layer (no READ access to the load library dataset profile), not a Db2 GRANT problem — a distinction that's easy for a LUW DBA to miss, since in LUW almost all access control conversations happen inside the database engine itself.",
    handsOn:"For a hypothetical new hire, list which authorizations they'd need at each layer to run a REORG utility job: (1) RACF dataset access to submit JCL and read/write the relevant libraries, (2) RACF authority to the Db2 subsystem/resource class if governed that way, (3) Db2-level privilege (e.g., REORG privilege on the table space). Notice these are three distinct checks, not one.",
    trap:"Do not assume 'access denied' always means a Db2 privilege problem. On z/OS, an access failure can originate at the RACF/dataset layer, the Db2 connection/authorization exit layer, or the Db2 SQL privilege layer — each requires a different fix and often a different team.",
    remember:[
      "RACF governs z/OS-level resources: datasets, started tasks, TSO logon, and can gate Db2 connect authority.",
      "Started tasks (Db2's own address spaces) run under RACF-defined identities.",
      "Db2's own GRANT/REVOKE privilege model operates as a separate layer once you're already connected.",
      "'Access denied' can originate at the RACF layer or the Db2 layer — diagnose which one first.",
      "Security administration on z/OS is often a distinct team/role from the Db2 DBA team."
    ],
    check:[
      {q:"What does RACF primarily protect on z/OS?", options:["Only SQL table access","Datasets, started tasks, logon, and (via exits) Db2 connection authority","Only network firewall rules","Only encryption keys"], answer:1, explain:"RACF is the general-purpose z/OS security manager governing many resource types, including gating Db2 connect authority via security exits."},
      {q:"A batch job fails to allocate a Db2 load library dataset with a security violation. Where is the problem most likely?", options:["A Db2 GRANT is missing","A RACF dataset access authorization is missing","The SQL statement has a syntax error","The buffer pool is full"], answer:1, explain:"Dataset-level access failures are a RACF/z/OS-layer issue, not a Db2 privilege issue."},
      {q:"What runs under a RACF-defined identity in a Db2 subsystem?", options:["Nothing — Db2 is exempt from RACF","Each Db2 started task (MSTR, DBM1, IRLM, DIST, etc.)","Only SQL SELECT statements","Only the DBA's personal logon"], answer:1, explain:"Db2's address spaces are started tasks, each typically associated with a RACF identity that authorizes their resource access."}
    ],
    deep:`<p data-level="dba"><span class="levelmark dba">DBA</span> Trusted contexts and roles in Db2 for z/OS provide a Db2-native way to layer additional, context-aware authorization (e.g., restricting a powerful ID to only act through a specific application/address space combination) on top of RACF-governed connect authority — verify current syntax and behavior against IBM documentation for your Db2 version.</p>`,
    sources:[["IBM Documentation — RACF","https://www.ibm.com/docs/en/zos/latest?topic=guides-racf"],["IBM Documentation — Db2 for z/OS Security","https://www.ibm.com/docs/en/db2-for-zos"]]
  })]
});

COURSE.modules.push({
  id:"m08", num:"08", title:"Db2 for z/OS Architecture", level:"core",
  blurb:"The core transition module: subsystem, address spaces, IRLM, DDF, buffer pools, logs, catalog, and directory.",
  lessons:[ L({
    id:"m08-l1", title:"Anatomy of a Db2 Subsystem",
    why:"This is the architectural map everything else in the course hangs off of. Once you can name each address space and what it does, utility JCL, commands, and troubleshooting all start making structural sense instead of feeling arbitrary.",
    luw:{ know:"A Db2 LUW instance: one set of OS processes (db2sysc and friends) managing one or more databases, with its own memory (instance/database shared memory), logs, and configuration (dbm cfg / db cfg).",
          changes:"A Db2 for z/OS 'subsystem' is the unit that corresponds most closely to an LUW instance, but it is implemented as several distinct, cooperating z/OS address spaces (started tasks), each with a specific job. Subsystem parameters (ZPARMs) roughly correspond to dbm/db cfg, but are compiled into a load module and activated via a specific process, not simply updated live in most cases.",
          why:"Splitting responsibilities across dedicated address spaces (engine, data manager, locking, distributed access, stored procedures) lets z/OS schedule, isolate, and tune each concern independently — consistent with the platform's general philosophy of fine-grained address-space isolation for reliability and workload management." },
    concept:`<p>A Db2 subsystem's core started tasks:</p>
      <div class="table-scroll"><table>
      <tr><th>Address space</th><th>Common name</th><th>Role</th><th>Rough LUW analogy</th></tr>
      <tr><td>DSN1MSTR</td><td>MSTR (System Services)</td><td>Coordinates the subsystem: logging, recovery, checkpoint, command processing</td><td>Core instance/engine control process</td></tr>
      <tr><td>DSN1DBM1</td><td>DBM1 (Database Services)</td><td>SQL processing, buffer manager, data manager — where most of the "engine work" happens</td><td>The main db2sysc-style data engine process</td></tr>
      <tr><td>IRLM</td><td>IRLM (Internal Resource Lock Manager)</td><td>Manages locking (and, in data sharing, global locking via the coupling facility)</td><td>Db2 LUW's internal lock manager component, but here it's a separate address space, and can be shared across subsystems in data sharing</td></tr>
      <tr><td>DSN1DIST</td><td>DIST (Distributed Data Facility / DDF)</td><td>Handles remote/distributed connections via DRDA over TCP/IP</td><td>Db2 LUW's connection/communication layer, but architecturally its own address space</td></tr>
      <tr><td>SPAS</td><td>Stored Procedure Address Space</td><td>Isolates execution of stored procedures (and some UDFs) from the core engine address spaces, often under WLM management</td><td>Db2 LUW's fenced-mode process model for routines, but explicitly WLM-managed</td></tr>
      </table></div>
      <p>Alongside the started tasks, the subsystem owns key structures:</p>
      <ul>
        <li><strong>Buffer pools</strong> — in-memory page caches (Module 13), configured per subsystem, not per database.</li>
        <li><strong>Active logs / archive logs / BSDS</strong> — the logging and recovery infrastructure (Module 14).</li>
        <li><strong>Catalog and directory</strong> — the subsystem-wide metadata repository (Module 10).</li>
        <li><strong>WLM (Workload Manager)</strong> — z/OS's own workload manager, which Db2 delegates to for prioritizing stored procedure execution, DDF work, and more (Module 23).</li>
      </ul>`,
    visual:`<div class="diagram"><div class="box-tree">z/OS  (one LPAR)
  │
  └─ Db2 subsystem   (e.g. DB2A)
        │
        ├─ MSTR   ── system services: logging, recovery, commands
        ├─ DBM1   ── SQL engine, buffer manager, data manager
        ├─ IRLM   ── lock manager
        ├─ DIST   ── DDF: remote/distributed connections (DRDA)
        ├─ SPAS   ── stored procedure address space(s), WLM-managed
        │
        ├─ Buffer pools
        ├─ Active logs / Archive logs / BSDS
        └─ Catalog & Directory</div></div>`,
    example:"When a DBA is asked 'why is CPU spiking on the subsystem,' the very first structural question is: which address space? High CPU in DBM1 often points to SQL/data-processing load; high CPU in DIST points to distributed workload; high CPU in a WLM-managed SPAS points to stored procedure activity. This decomposition — impossible in a single-process LUW instance view — is the everyday payoff of understanding the architecture.",
    handsOn:"Match each symptom to the most likely address space: (1) a REORG utility appears stuck; (2) a remote Java application's connections are piling up; (3) two applications are deadlocking; (4) a stored procedure is consuming excessive CPU. (Answers: DBM1/utility processing; DIST; IRLM; SPAS.)",
    trap:"Don't look for 'the Db2 process' the way you'd look for db2sysc in `ps -ef`. There is no single process — there is a coordinated set of address spaces, and diagnosing performance or availability problems means knowing which one is relevant to the symptom.",
    remember:[
      "A Db2 subsystem = a coordinated set of z/OS address spaces (MSTR, DBM1, IRLM, DIST, SPAS...), not one process.",
      "MSTR = system services/logging/recovery; DBM1 = the SQL/data engine; IRLM = locking; DIST = DDF/remote connections; SPAS = stored procedures.",
      "Buffer pools, logs/BSDS, and the catalog/directory are subsystem-wide structures.",
      "WLM (an z/OS facility, not Db2-specific) manages priority for stored procedures and DDF work.",
      "Diagnosing a problem usually starts with 'which address space is involved,' a question that doesn't exist in a single-process LUW instance."
    ],
    check:[
      {q:"Which Db2 for z/OS address space handles the core SQL processing, buffer management, and data management work?", options:["MSTR","DBM1","IRLM","DIST"], answer:1, explain:"DBM1 (Database Services) is where core SQL engine, buffer manager, and data manager processing happens."},
      {q:"Which address space manages locking, including global locking in a data-sharing group?", options:["SPAS","DIST","IRLM","MSTR"], answer:2, explain:"IRLM (Internal Resource Lock Manager) manages locking, coordinating with the coupling facility in data sharing."},
      {q:"A remote application's DRDA connections are piling up. Which address space is most directly relevant?", options:["DBM1","DIST","SPAS","MSTR"], answer:1, explain:"DIST (DDF) handles distributed/remote connections via DRDA over TCP/IP."}
    ],
    deep:`<p data-level="expert"><span class="levelmark expert">Expert</span> In a data-sharing group, each member subsystem still has its own MSTR/DBM1/IRLM/DIST/SPAS set, but IRLM coordinates global locking through the coupling facility, and buffer pools coordinate coherency through group buffer pools (Module 25) — the address-space model per member doesn't change, but its scope of coordination expands across the sysplex.</p>`,
    sources:[["IBM Documentation — Db2 for z/OS Introduction","https://www.ibm.com/docs/en/db2-for-zos"],["IBM Redbooks — Db2 for z/OS architecture","https://www.redbooks.ibm.com"]]
  })]
});

COURSE.modules.push({
  id:"m09", num:"09", title:"Db2 LUW vs Db2 for z/OS: Comparison Matrix", level:"core",
  blurb:"A comprehensive, color-coded comparison across every major concept area — familiar, modified, or genuinely new.",
  lessons:[ L({
    id:"m09-l1", title:"The Full Comparison Matrix",
    why:"This module consolidates every LUW bridge from the rest of the course into one reference you'll return to repeatedly. It's designed to be scanned, not read start to finish.",
    luw:null,
    concept:`<p><span class="tag-luw">Green = familiar</span> &nbsp; <span class="tag-mod">Yellow = modified concept</span> &nbsp; <span class="tag-new">Red = genuinely new</span></p>
      <div class="table-scroll"><table>
      <tr><th>Area</th><th>Db2 LUW</th><th>Db2 for z/OS</th><th>Category</th></tr>
      <tr><td>Runtime unit</td><td>Instance (OS processes)</td><td>Subsystem (coordinated address spaces)</td><td><span class="tag-mod">Modified</span></td></tr>
      <tr><td>Database objects</td><td>Tables, indexes, views, schemas</td><td>Same relational model: tables, indexes, views</td><td><span class="tag-luw">Familiar</span></td></tr>
      <tr><td>Storage container</td><td>Filesystem files/directories</td><td>VSAM linear datasets, cataloged, on DASD</td><td><span class="tag-new">New</span></td></tr>

          changes:"A Db2 for z/OS STOGROUP (storage group) is a named collection of DASD volumes (or an SMS storage class) that Db2 uses to automatically allocate the underlying VSAM datasets for table spaces and indexes — Db2-managed storage is the modern norm, similar in spirit to LUW automatic storage, but expressed through STOGROUPs and SMS classes.",

    concept:`<p>The storage stack for a Db2-managed table space:</p>
      <ul>
        <li><strong>STOGROUP</strong> — defines eligible DASD volumes or references an SMS storage class/data class/management class.</li>
        <li><strong>SMS (Storage Management Subsystem)</strong> — z/OS's automated storage placement and management facility; most modern shops let SMS pick actual volumes rather than hard-coding volume serials.</li>

        <li><strong>User-managed datasets</strong> — a legacy pattern where the DBA manually VSAM-defines datasets before creating objects against them; still seen in older environments but Db2-managed storage is standard practice today.</li>

   │
   ▼
SMS  ── selects actual volume(s)
   │
   ▼
Db2-managed VSAM linear dataset(s)  ── DSNDBC.*/DSNDBD.* naming pattern
   │
   ▼
Physical DASD</div></div>`,

  blurb:"Simple, segmented, and universal table spaces; partitioning; clustering; compression; index types.",
  lessons:[ L({
    id:"m12-l1", title:"Table Space Types and Partitioning",
    why:"Table space type drives huge amounts of downstream behavior: how utilities run, how partitioning and clustering work, and what modern features (like online REORG or partition-level operations) are available. Choosing/inheriting the wrong type is a common migration trap.",
    luw:{ know:"LUW table spaces (regular/large, automatic storage) with range partitioning as an explicit, mature feature.",
          changes:"Db2 for z/OS has evolved through several table space types — simple (legacy, effectively obsolete), segmented, partitioned (classic), and now Universal Table Spaces (UTS), which come in two flavors: partition-by-growth (PBG) and partition-by-range (PBR). Universal table spaces are the modern standard and combine the benefits of segmented space management with partitioning.",
          why:"The evolution reflects decades of incremental improvement: early table space types optimized for the storage constraints and utility patterns of their era; UTS was introduced to unify best practices (segmented space, independent partitions, better utility concurrency) into one recommended design." },
    concept:`<p>Table space type summary:</p>
      <div class="table-scroll"><table>
      <tr><th>Type</th><th>Status</th><th>Key trait</th></tr>
      <tr><td>Simple</td><td>Legacy/obsolete</td><td>Multiple tables could share pages — a source of many historical problems; avoid in new designs.</td></tr>
      <tr><td>Segmented</td><td>Legacy but still seen</td><td>Space organized in segments per table; better than simple, largely superseded by UTS.</td></tr>
      <tr><td>Classic partitioned</td><td>Legacy</td><td>Partitioned by explicit range, predates UTS partition-by-range.</td></tr>
      <tr><td>Universal Table Space — Partition-By-Growth (PBG)</td><td>Modern standard for non-partitioned-by-key tables</td><td>Automatically adds partitions as data grows; good default for tables without a natural range key.</td></tr>
      <tr><td>Universal Table Space — Partition-By-Range (PBR)</td><td>Modern standard for large, range-partitionable tables</td><td>Explicit range partitioning (like LUW range partitioning), combined with segmented space management benefits.</td></tr>
      </table></div>
      <p>Other core concepts:</p>
      <ul>
        <li><strong>Clustering</strong> — a clustering index determines the physical row order Db2 attempts to maintain, directly affecting sequential access performance — conceptually similar to LUW clustering indexes.</li>
        <li><strong>DSSIZE</strong> — the maximum size of a data set (and, for partitioned spaces, of each partition) — a capacity-planning parameter with no direct LUW equivalent phrased the same way.</li>
        <li><strong>Compression</strong> — hardware-assisted compression is common and usually a straightforward win for I/O-bound workloads, similar in spirit to LUW row compression.</li>
        <li><strong>Indexes</strong> — including partitioned indexes (index partitioning independent of or aligned with table partitioning), and support for LOB/XML auxiliary structures.</li>
      </ul>`,
    visual:`<div class="diagram"><div class="box-tree">Table space evolution (older → modern)
Simple  →  Segmented  →  Classic partitioned
                                   │
                                   ▼
                     Universal Table Space (UTS)
                        ├─ Partition-By-Growth (PBG)
                        └─ Partition-By-Range   (PBR)</div></div>`,
    example:"A migration project inherits a legacy segmented table space holding a 200GB transaction history table with no partitioning. The DBA plans a conversion to Universal PBR, choosing partition boundaries on the transaction date column — directly analogous to redesigning a LUW range-partitioned table, but executed through Db2 for z/OS's own ALTER/REORG-based conversion path.",
    handsOn:"For a new 500-million-row fact table with a natural monthly range key, decide: PBG or PBR? Justify the choice using what you know about range-based partition pruning and maintenance windows from LUW partitioning experience.",

      "DSSIZE governs maximum data set / partition size — a capacity-planning knob unique to this platform's terminology."

      {q:"What does Partition-By-Growth (PBG) do?", options:["Partitions by a range key you define","Automatically adds partitions as data volume grows, without a range key","Deletes old partitions automatically","Is only used for indexes"], answer:1, explain:"PBG automatically manages partition growth without requiring a range partitioning key."},

          why:"Subsystem-level buffer pools reflect the platform's model of one subsystem serving many databases/applications, needing centrally managed shared memory rather than per-database memory pools — consistent with z/OS's broader emphasis on centrally managed, workload-shared resources." },
    concept:`<p>Key facts:</p>
      <ul>
        <li><strong>Page sizes</strong> — 4K, 8K, 16K, 32K; a table space is assigned to a buffer pool of a matching page size, and larger page sizes suit wider rows or LOB-adjacent design choices.</li>
        <li><strong>Naming</strong> — buffer pools are named BP0-BP49 (4K), BP8K0-BP8K9, BP16K0-BP16K9, BP32K-BP32K9 (naming conventions vary slightly by release — verify current ranges).</li>
        <li><strong>Virtual vs. real storage</strong> — buffer pools are allocated in virtual storage backed by real storage; with 64-bit addressing, very large buffer pools are feasible, but real storage constraints and paging still matter operationally.</li>
        <li><strong>Tuning levers</strong> — pool size (VPSIZE), thresholds for deferred write, sequential steal, parallel sequential, and page-fix options; hit ratio and getpage/synchronous-read counts (from statistics traces) are the primary tuning signals.</li>

        <div class="box">Db2 (DBM1)</div><div class="arrow">↓</div>

        <div class="box">VSAM / DASD (via channels)</div>

    remember:[

      "Fixed page sizes: 4K/8K/16K/32K — a table space's buffer pool must match its page size.",
      "Isolating workloads into dedicated buffer pools is a common z/OS-specific tuning technique.",
      "Hit ratio and getpage/synchronous-read statistics are the primary tuning signals, conceptually familiar from LUW.",
