COURSE.modules.push({
  id:"m28", num:"28", title:"Db2 Migration and Maintenance", level:"deep",
  blurb:"Version migration, APAR/PTF/HIPER concepts, CATMAINT, and how z/OS maintenance culture differs from LUW patching.",
  lessons:[ L({
    id:"m28-l1", title:"Maintenance and Migration Culture",
    why:"Db2 for z/OS shops follow a maintenance discipline and vocabulary (APAR, PTF, HIPER) that differs from typical LUW patching cadence — knowing the terms lets you participate in migration planning conversations immediately.",
    luw:{ know:"Fix packs / mod packs applied on a planned cadence, with pre/post checks, sometimes via automated patching pipelines.",
          changes:"z/OS maintenance flows through APARs (Authorized Program Analysis Reports — the record of a reported problem), PTFs (Program Temporary Fixes — the actual corrective code, applied via SMP/E), and special categories like HIPER (HIGH Impact PErvasive fixes — critical, install promptly) and SPE (Small Programming Enhancement — new function delivered as maintenance). Version migration (e.g., moving to a new Db2 release) is a more involved, catalog-structure-aware process, often using CATMAINT (Module 15) as part of the migration steps.",
          why:"SMP/E-based maintenance and the APAR/PTF/HIPER vocabulary long predate modern CI/CD patching pipelines and reflect a highly formalized, audit-friendly change-tracking discipline standard across all z/OS software, not just Db2." },
    concept:`<p>Vocabulary:</p>
      <ul>
        <li><strong>APAR</strong> — the tracked record of a reported defect/problem.</li>
        <li><strong>PTF</strong> — the actual fix code corresponding to one or more APARs, applied via SMP/E.</li>
        <li><strong>HIPER</strong> — a PTF flagged as High Impact PErvasive — install promptly due to significant risk if left unapplied.</li>
        <li><strong>SPE</strong> — Small Programming Enhancement — new functionality delivered outside a full version upgrade, via maintenance.</li>
        <li><strong>RSU</strong> — Recommended Service Upgrade — a curated, tested bundle of PTFs some shops adopt as a maintenance baseline instead of applying PTFs ad hoc (terminology and availability can vary — verify current IBM guidance).</li>
        <li><strong>Fallback</strong> — the ability to back out a maintenance change if it causes problems; planning fallback options is standard practice before applying significant maintenance.</li>
        <li><strong>Version migration</strong> — moving to a new Db2 release involves catalog structure changes (via CATMAINT and related processes), compatibility mode considerations, and a formal migration plan — a bigger, more structured undertaking than typical LUW fix pack application.</li>

COURSE.modules.push({
  id:"m32", num:"32", title:"Real DBA Operations — On-Call Incidents", level:"deep",
  blurb:"You are Db2 for z/OS DBA on call. Twelve realistic incidents to observe, hypothesize, inspect, interpret, decide, act, and validate.",
  lessons:[ L({
    id:"m32-l1", title:"On-Call: Twelve Incidents",
    why:"Real DBA skill shows up under incident pressure. Each scenario below withholds the answer behind a reveal so you practice reasoning first, the same discipline used throughout this course's troubleshooting framework.",
    luw:null,
    concept:`<p>For each incident, form your own hypothesis before expanding "Reasoning &amp; likely resolution."</p>
      <details class="deep"><summary>Incident 1 — A table space is unavailable</summary>
        <p><strong>Observe:</strong> Application errors show SQLCODE indicating the object is unavailable (e.g., stopped or in a restrictive status).</p>
        <p><strong>Reasoning &amp; likely resolution:</strong> Run -DISPLAY DATABASE to check status (stopped, restart-pending, utility-pending, etc.). If stopped intentionally (e.g., mid-utility), coordinate before starting; if in an abnormal restrictive state, determine whether a RECOVER or -START with appropriate access mode is needed. Never blindly -START without understanding why it was in that state.</p>
      </details>
      <details class="deep"><summary>Incident 2 — A batch job failed with a Db2 SQLCODE</summary>
        <p><strong>Reasoning:</strong> Check SDSF SYSPRINT for the exact SQLCODE and SQLSTATE. Use the SQLCODE Explorer (this course) to understand typical causes. Common candidates: -911/-913 (deadlock/timeout — Module 20), -805 (package not found — Module 18 bind issue), -904 (resource unavailable — check object status per Incident 1).</p>
      </details>
      <details class="deep"><summary>Incident 3 — A utility is running much longer than expected</summary>
        <p><strong>Reasoning:</strong> -DISPLAY UTILITY(*) to check current phase. If stuck in a phase requiring a drain (Module 20), check for long-running application transactions holding claims. Compare elapsed time against historical baselines for that object's size before assuming something is actually wrong versus simply larger data volume.</p>
      </details>
      <details class="deep"><summary>Incident 4 — Application response time suddenly increased</summary>
        <p><strong>Reasoning:</strong> Structured decomposition from Module 22: pull accounting trace data, split elapsed time into CPU/I/O/lock/other wait. Cross-check whether a recent REBIND (Module 21) changed an access path, or whether a WLM classification/priority change (Module 23) is starving this workload.</p>
      </details>
      <details class="deep"><summary>Incident 5 — DDF threads are accumulating</summary>
        <p><strong>Reasoning:</strong> Module 19's triage: -DISPLAY THREAD(*) TYPE(ACTIVE) to separate active vs. idle-but-held threads. Check for an application connection pool leak, a WLM service class starving DDF work, or threads blocked on locks/claims.</p>
      </details>
      <details class="deep"><summary>Incident 6 — Deadlocks increased</summary>
        <p><strong>Reasoning:</strong> Standard deadlock diagnosis (Module 20) transfers directly from LUW: identify the lock cycle from trace/diagnostic output, identify which statements/objects are involved, and look for a recent application change (new access pattern, new index affecting lock order) that introduced the conflict.</p>
      </details>
      <details class="deep"><summary>Incident 7 — A package access path regressed after REBIND</summary>
        <p><strong>Reasoning:</strong> This is Module 21's core scenario. Compare PLAN_TABLE output before/after the REBIND. Check whether RUNSTATS ran with representative statistics beforehand. Consider using access path stability/plan management tooling to fall back to the prior plan while investigating.</p>
      </details>
      <details class="deep"><summary>Incident 8 — Buffer pool hit ratio changed dramatically</summary>
        <p><strong>Reasoning:</strong> Module 13/22: check -DISPLAY BUFFERPOOL statistics. A dramatic drop can mean a new large batch workload sharing the pool (evicting other objects' pages) or a genuine working-set growth. Consider whether buffer pool isolation for the affected object is warranted.</p>
      </details>
      <details class="deep"><summary>Incident 9 — A subsystem restarted unexpectedly</summary>
        <p><strong>Reasoning:</strong> Restart recovery (Module 14) handles data consistency automatically; the DBA's job is reviewing console/system logs to root-cause the outage (abend, storage shortage, hardware event) and confirming restart completed cleanly with no retained locks or in-doubt units of work blocking access.</p>
      </details>
      <details class="deep"><summary>Incident 10 — A data-sharing member failed</summary>
        <p><strong>Reasoning:</strong> Module 25/27: confirm surviving members are serving all applications. Investigate the failed member's restart, watch for retained locks the surviving members must respect until resolved, and root-cause the failure (LPAR issue, CF connectivity, software abend).</p>
      </details>
      <details class="deep"><summary>Incident 11 — Archive log problems appear</summary>
        <p><strong>Reasoning:</strong> Module 14/27: check BSDS log inventory and duplex copies. Determine whether this threatens an in-progress or future RECOVER's achievable recovery point, and escalate immediately if so — this is a business-risk conversation, not just a technical one.</p>
      </details>
      <details class="deep"><summary>Incident 12 — A RUNSTATS job failed</summary>
        <p><strong>Reasoning:</strong> Check SYSPRINT for the actual error (Module 6 diagnostic sequence). Common causes: object in an inconsistent/utility-pending state blocking RUNSTATS, insufficient work space, or a syntax error in the SYSIN control statement (Module 15). Until RUNSTATS succeeds, remember optimizer decisions for any subsequent REBIND will use stale statistics.</p>
      </details>`,
    visual:"", example:"", handsOn:"Pick any two incidents above, close the reveal, and write your own hypothesis and first three diagnostic actions before re-opening the reasoning — this rehearsal is the actual skill being built, not the answer itself.",
    trap:"The trap across every incident here is the same: acting before establishing scope and evidence. On a shared subsystem, an action taken to fix one symptom (e.g., blindly restarting an object) can affect many unrelated applications — always understand blast radius first.",
    remember:[
      "Every incident starts the same way: observe → establish scope → gather evidence → hypothesize → test → act → validate.",
      "Many symptoms (slow response, DDF accumulation, deadlocks) trace back to concepts from Modules 18-23 — the bind/lock/WLM model.",
      "Never blindly restart/start an object without understanding why it was in its current state.",
      "Data-sharing and logging incidents (10-11) carry business-risk implications that require prompt escalation, not just technical triage.",
      "Compare against historical baselines before assuming 'slow' or 'long' automatically means 'broken.'"
    ],
    check:[
      {q:"Before restarting a table space that shows as stopped, what should you do first?", options:["Nothing, just restart it immediately","Understand why it's in that state before acting","Always assume it's a RACF problem","Immediately run CATMAINT"], answer:1, explain:"Acting without understanding why an object is stopped can cause more harm than the original issue."},
      {q:"A package's performance regressed right after a REBIND. What's the most targeted next step?", options:["Rebuild the whole subsystem","Compare PLAN_TABLE access paths before and after the REBIND","Increase buffer pool size blindly","Ignore it, REBIND is always safe"], answer:1, explain:"Comparing access paths directly targets the likely cause: a new, worse access path chosen at REBIND."},
      {q:"What is the common thread across all twelve incidents' recommended approach?", options:["Immediately escalate to IBM support","A structured observe-scope-evidence-hypothesize-act-validate sequence","Always restart the subsystem","Ignore SYSPRINT output"], answer:1, explain:"The structured troubleshooting framework applies consistently across all incident types."}
    ],
    deep:"", sources:[]

const GLOSSARY = [
  ["DASD","Direct Access Storage Device — the traditional term for the disk storage holding z/OS datasets.","Roughly: 'disk storage', but as a formal architectural term.","See Module 2-3."],
  ["Dataset","A named, cataloged unit of stored data on DASD.","A file, but located by catalog lookup rather than a directory path.","See Module 3."],
  ["PDS","Partitioned Data Set — a dataset containing named 'members', like a simple library of small files.","A directory of small files, accessed by member name.","See Module 3."],
  ["PDSE","Partitioned Data Set Extended — a modern, more robust version of a PDS.","Same idea as PDS, improved implementation.","See Module 3."],
  ["VSAM","Virtual Storage Access Method — a z/OS access method supporting keyed/indexed dataset organizations; Db2 table spaces/indexes are VSAM linear datasets.","No exact equivalent; closest is 'how a storage engine organizes files on disk', but exposed as an OS-level access method.","See Module 3, 11."],
  ["LDS","Linear Data Set — a VSAM dataset organization used to implement Db2 table spaces and indexes.","No direct equivalent.","See Module 3, 11."],
  ["LPAR","Logical Partition — a hardware-level division of a physical IBM Z machine, running one OS image.","No exact equivalent; loosely like a VM, but hardware/firmware-level.","See Module 2."],
  ["PR/SM","Processor Resource/Systems Manager — the firmware hypervisor that creates and manages LPARs.","Loosely like a hypervisor (e.g., a Type-1 hypervisor), but firmware-based and decades older.","See Module 2."],
  ["z/OS","IBM's mainframe operating system for IBM Z hardware.","Analogous role to Linux, but different lineage and architecture.","See Module 2-3."],
  ["TSO","Time Sharing Option — the interactive session facility on z/OS.","An SSH interactive session.","See Module 4."],
  ["ISPF","Interactive System Productivity Facility — the panel-driven application running inside TSO.","No exact equivalent; loosely like a menu-driven admin console.","See Module 4."],
  ["JES","Job Entry Subsystem — manages job queuing, execution, and spool output (JES2 is the common implementation).","A job scheduler / CI pipeline runner.","See Module 6."],
  ["SDSF","System Display and Search Facility — the tool for browsing job spool output.","A job scheduler's log/dashboard UI.","See Module 6."],
  ["JCL","Job Control Language — the declarative language describing batch jobs, steps, and datasets.","Shell scripts / CI pipeline YAML, but declarative resource allocation, not procedural.","See Module 5."],
  ["RACF","Resource Access Control Facility — z/OS's security manager.","OS users/groups + sudoers, but centrally governing many resource types.","See Module 7."],
  ["Subsystem","A Db2 for z/OS runtime unit: a coordinated set of z/OS address spaces.","A Db2 LUW instance.","See Module 8."],
  ["DBM1","The Db2 Database Services address space — SQL engine, buffer manager, data manager.","The core engine process.","See Module 8."],
  ["MSTR","The Db2 System Services address space — logging, recovery, checkpoint, command processing.","Core instance control process.","See Module 8."],
  ["IRLM","Internal Resource Lock Manager — the address space managing locking.","The internal lock manager component.","See Module 8, 20."],
  ["DDF","Distributed Data Facility — handles remote/distributed DRDA connections (runs in the DIST address space).","The connection/communication layer.","See Module 8, 19."],
  ["BSDS","Bootstrap Data Set — tracks log inventory and checkpoint information critical for subsystem restart.","No direct equivalent.","See Module 14."],
  ["RBA","Relative Byte Address — a log position identifier used in non-data-sharing logging.","No direct equivalent.","See Module 14, 25."],
  ["LRSN","Log Record Sequence Number — a sysplex-wide consistent log sequencing mechanism used in data sharing.","No direct equivalent.","See Module 25."],
  ["GBP","Group Buffer Pool — a Coupling Facility structure maintaining page coherency across data-sharing members.","No direct equivalent.","See Module 13, 25."],
  ["CF","Coupling Facility — specialized shared hardware/LPAR resource enabling Parallel Sysplex coordination.","No direct equivalent.","See Module 2, 25."],
  ["Sysplex","A cluster of z/OS LPARs coordinated via coupling facilities (Parallel Sysplex).","Loosely like a cluster, but a distinct, older architecture.","See Module 25."],
  ["Package","The bound, executable form of one program's SQL, with a resolved access path.","No direct equivalent — closest is a cached prepared statement, but persistent and versioned.","See Module 18."],

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function allLessons(){
  const out=[];
  COURSE.modules.forEach(m=>m.lessons.forEach(l=>out.push({mod:m,lesson:l})));
  return out;
}
function findLesson(modId,lessonId){
  const mod = COURSE.modules.find(m=>m.id===modId);
  if(!mod) return null;
  const lesson = mod.lessons.find(l=>l.id===lessonId) || mod.lessons[0];
  return {mod, lesson};
}
function lessonProgress(){
  const total = allLessons().length;
  const done = Object.values(STATE.completedLessons).filter(Boolean).length;
  return {total, done, pct: total? Math.round(done/total*100):0};
}
function levelProgress(level){
  const lessons = allLessons().filter(x=>x.mod.level===level);
  const total = lessons.length;
  const done = lessons.filter(x=>STATE.completedLessons[x.lesson.id]).length;
  return {total, done, pct: total? Math.round(done/total*100):0};
}
function go(hash){ location.hash = hash; }
function closeModal(){ document.getElementById("modal-root").innerHTML=""; }
function openModal(innerHtml){
  document.getElementById("modal-root").innerHTML =
    '<div class="modal-overlay" id="modalOverlay"><div class="modal-box" role="dialog" aria-modal="true">'+
    '<button class="modal-close" id="modalCloseBtn" aria-label="Close">×</button>'+ innerHtml +'</div></div>';
  document.getElementById("modalOverlay").addEventListener("click", e=>{ if(e.target.id==="modalOverlay") closeModal(); });
  document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
  document.addEventListener("keydown", escOnce);
}
function escOnce(e){ if(e.key==="Escape"){ closeModal(); document.removeEventListener("keydown", escOnce); } }

function renderQuizBlock(lesson){
  return lesson.check.map((q,qi)=>{
    const opts = q.options.map((o,oi)=>'<div class="quiz-opt" data-q="'+qi+'" data-o="'+oi+'" tabindex="0" role="button">'+esc(o)+'</div>').join("");
    return '<div class="quiz-q" data-quiz="'+qi+'"><div class="qtext">'+(qi+1)+'. '+esc(q.q)+'</div>'+opts+
      '<div class="quiz-explain" id="explain-'+lesson.id+'-'+qi+'">'+esc(q.explain)+'</div></div>';
  }).join("");
}
function wireQuiz(lesson){
  if(!lesson.check) return;
  document.querySelectorAll('.quiz-q').forEach(qEl=>{
    const qi = parseInt(qEl.getAttribute("data-quiz"),10);
    const q = lesson.check[qi];
    qEl.querySelectorAll(".quiz-opt").forEach(optEl=>{
      const activate=()=>{
        if(qEl.dataset.answered) return;
        qEl.dataset.answered="1";
        const oi = parseInt(optEl.getAttribute("data-o"),10);
        qEl.querySelectorAll(".quiz-opt").forEach((el,i)=>{
          if(i===q.answer) el.classList.add("correct");
          else if(i===oi) el.classList.add("incorrect");
        });
        const ex = document.getElementById("explain-"+lesson.id+"-"+qi);
        if(ex) ex.classList.add("show");
      };
      optEl.addEventListener("click", activate);
      optEl.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); activate(); } });
    });
  });
}

const FINAL_CATEGORIES = ["z/OS Fundamentals","JCL","Db2 Architecture","Utilities","SQL","Recovery","Performance","Data Sharing","Troubleshooting"];
function buildFinalQuestions(){
  // Pull real check questions from across relevant modules and tag them by category.
  const byCat = {
    "z/OS Fundamentals": ["m02","m03","m04","m06","m07"],
    "JCL": ["m05"],
    "Db2 Architecture": ["m08","m09"],
    "Utilities": ["m15","m16"],
    "SQL": ["m17","m18","m21"],
    "Recovery": ["m14","m27"],
    "Performance": ["m13","m20","m22","m23"],
    "Data Sharing": ["m25","m26"],
    "Troubleshooting": ["m19","m24","m32"]
  };
  const out = [];
  Object.entries(byCat).forEach(([cat, modIds])=>{
    modIds.forEach(mid=>{
      const mod = COURSE.modules.find(m=>m.id===mid);
      if(!mod) return;
      mod.lessons.forEach(l=> (l.check||[]).forEach(q=> out.push({cat, q})));
    });
  });
  return out;
}
function renderFinal(){
  const c = document.getElementById("content");
  const questions = buildFinalQuestions();
  let qHtml = questions.map((item,i)=>{
    const opts = item.q.options.map((o,oi)=>'<div class="quiz-opt" data-fi="'+i+'" data-oi="'+oi+'" tabindex="0" role="button">'+esc(o)+'</div>').join("");
    return '<div class="quiz-q" data-cat="'+esc(item.cat)+'"><div class="qtext">'+(i+1)+'. ['+item.cat+'] '+esc(item.q.q)+'</div>'+opts+
      '<div class="quiz-explain" id="fexp-'+i+'">'+esc(item.q.explain)+'</div></div>';
  }).join("");
  c.innerHTML = `
    <div class="breadcrumb"><a href="#/">Dashboard</a> / <span>Final Assessment</span></div>
    <h1>Final Assessment</h1>
    <p style="color:var(--text-dim);">Drawn from across every module. Answer each question, then generate your competency report. This is for your own calibration, not a pass/fail gate.</p>
    <div class="card">${qHtml}
      <div class="btnrow" style="margin-top:16px;"><button class="pill-btn" id="btnFinalScore">Generate Competency Report</button></div>
      <div id="finalReport"></div>
    </div>
  `;
  const answers = {};
  document.querySelectorAll(".quiz-opt[data-fi]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const fi = el.getAttribute("data-fi");
      const oi = parseInt(el.getAttribute("data-oi"),10);
      const qEl = el.closest(".quiz-q");
      if(qEl.dataset.answered) return;
      qEl.dataset.answered="1";
      answers[fi]=oi;
      const correctIdx = questions[fi].q.answer;
      qEl.querySelectorAll(".quiz-opt").forEach((o,i2)=>{
        if(i2===correctIdx) o.classList.add("correct"); else if(i2===oi) o.classList.add("incorrect");
      });
      document.getElementById("fexp-"+fi).classList.add("show");
    });
  });
  document.getElementById("btnFinalScore").onclick=()=>{
    const byCat = {};
    FINAL_CATEGORIES.forEach(cat=>byCat[cat]={correct:0,total:0});
    questions.forEach((item,i)=>{
      byCat[item.cat].total++;
      if(answers[i]===item.q.answer) byCat[item.cat].correct++;
    });
    let rows = FINAL_CATEGORIES.filter(cat=>byCat[cat].total>0).map(cat=>{
      const b = byCat[cat];
      const pct = b.total? Math.round(b.correct/b.total*100):0;
      return '<div class="progrow"><span class="label">'+cat+'</span><span class="progressbar"><span style="width:'+pct+'%"></span></span><span class="pct">'+pct+'%</span></div>';
    }).join("");
    const weakCats = FINAL_CATEGORIES.filter(cat=>byCat[cat].total>0 && (byCat[cat].correct/byCat[cat].total) < 0.75);
    STATE.finalAssessment = {answers, ts:Date.now()}; saveState();
    document.getElementById("finalReport").innerHTML = '<div class="card" style="margin-top:16px;"><h3>Competency Report</h3><div class="proglist">'+rows+'</div>'+
      (weakCats.length? '<p style="margin-top:12px;color:var(--text-dim);">Recommended review areas: <strong>'+weakCats.join(", ")+'</strong></p>' : '<p style="margin-top:12px;color:var(--green-ink);">Strong results across all assessed categories.</p>')+
      '</div>';
    window.scrollTo(0,document.body.scrollHeight);
  };
}

  input.focus();
  input.addEventListener("input", ()=>{
    const f = input.value.trim().toLowerCase();
    const results = document.getElementById("globalResults");
    if(f.length<2){ results.innerHTML=""; return; }
    let html = "";
    const lessonHits = allLessons().filter(x=> x.lesson.title.toLowerCase().includes(f) || x.mod.title.toLowerCase().includes(f)).slice(0,6);
    if(lessonHits.length){
      html += "<h4>Lessons</h4>" + lessonHits.map(x=>'<div class="clicknode" data-go="#/lesson/'+x.mod.id+'/'+x.lesson.id+'"><span class="t">'+esc(x.lesson.title)+'</span><span class="d" style="display:block;">Module '+x.mod.num+' · '+esc(x.mod.title)+'</span></div>').join("");
    }
    const glossHits = GLOSSARY.filter(g=>g[0].toLowerCase().includes(f)).slice(0,5);
    if(glossHits.length){
      html += "<h4>Glossary</h4>" + glossHits.map(g=>'<div class="clicknode" data-go="#/glossary"><span class="t">'+esc(g[0])+'</span></div>').join("");
    }
    const codeHits = SQLCODES.filter(s=>s.code.toLowerCase().includes(f)||s.name.toLowerCase().includes(f)).slice(0,5);
    if(codeHits.length){
      html += "<h4>SQLCODEs</h4>" + codeHits.map(s=>'<div class="clicknode" data-go="#/sqlcodes"><span class="t">SQLCODE '+esc(s.code)+' — '+esc(s.name)+'</span></div>').join("");
    }
    const cmdHits = COMMANDS.filter(cm=>cm.cmd.toLowerCase().includes(f)).slice(0,5);
    if(cmdHits.length){
      html += "<h4>Commands</h4>" + cmdHits.map(cm=>'<div class="clicknode" data-go="#/commands"><span class="t">'+esc(cm.cmd)+'</span></div>').join("");
    }
    results.innerHTML = html || '<p style="color:var(--text-dim);">No matches.</p>';
    results.querySelectorAll("[data-go]").forEach(el=>{
      el.addEventListener("click", ()=>{ closeModal(); go(el.getAttribute("data-go")); });
    });
  });
}

/* ==================================================================
   ACCESSIBILITY / SETTINGS MODAL
   ================================================================== */
function openA11y(){
  openModal(`
    <h2>Accessibility & Display Settings</h2>
    <div class="card">
      <h3 style="margin-top:0;">Font size</h3>
      <div class="btnrow">
        <button class="chip" data-fs="0.9">Smaller</button>
        <button class="chip" data-fs="1">Default</button>
        <button class="chip" data-fs="1.15">Larger</button>
        <button class="chip" data-fs="1.3">Largest</button>
      </div>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Contrast</h3>
      <div class="btnrow">
        <button class="chip" data-contrast="normal">Normal</button>
        <button class="chip" data-contrast="high">High contrast</button>
      </div>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Motion</h3>
      <div class="btnrow">
        <button class="chip" data-motion="normal">Normal</button>
        <button class="chip" data-motion="reduced">Reduced motion</button>
      </div>
    </div>
  `);
  document.querySelectorAll("[data-fs]").forEach(b=>b.addEventListener("click", ()=>{ STATE.fontScale=parseFloat(b.getAttribute("data-fs")); saveState(); applyTheme(); }));
  document.querySelectorAll("[data-contrast]").forEach(b=>b.addEventListener("click", ()=>{ STATE.contrast=b.getAttribute("data-contrast"); saveState(); applyTheme(); }));
  document.querySelectorAll("[data-motion]").forEach(b=>b.addEventListener("click", ()=>{ STATE.motion=b.getAttribute("data-motion"); saveState(); applyTheme(); }));
}

/* ==================================================================
   ROUTER
   ================================================================== */
function router(){
  const hash = location.hash.replace(/^#/,"") || "/";
  const parts = hash.split("/").filter(Boolean);
  closeModal();
  if(parts.length===0){ renderDashboard(); }
  else if(parts[0]==="lesson" && parts[1] && parts[2]){ renderLesson(parts[1], parts[2]); }
  else if(parts[0]==="module" && parts[1]){
    const mod = COURSE.modules.find(m=>m.id===parts[1]);
    if(mod) renderLesson(mod.id, mod.lessons[0].id); else renderDashboard();
  }
  else if(parts[0]==="diagnostic"){ renderDiagnostic(); }
  else if(parts[0]==="glossary"){ renderGlossary(""); }
  else if(parts[0]==="dictionary"){ renderDictionary(); }
  else if(parts[0]==="commands"){ renderCommands(); }
  else if(parts[0]==="sqlcodes"){ renderSQLCodes(); }
  else if(parts[0]==="map"){ renderMap(); }
  else if(parts[0]==="simulator"){ renderSimulator(); }
  else if(parts[0]==="jcllab"){ renderJCLLab(); }
  else if(parts[0]==="final"){ renderFinal(); }
  else if(parts[0]==="checklist"){ renderChecklist(); }
  else { renderDashboard(); }
  highlightActiveNav();
  document.getElementById("sidebar").classList.remove("open");
}

/* ==================================================================
   TOP BAR WIRING + INIT
   ================================================================== */
document.getElementById("brandBtn").addEventListener("click", ()=>go("#/"));
document.getElementById("searchBtn").addEventListener("click", openSearch);
document.getElementById("a11yBtn").addEventListener("click", openA11y);
document.getElementById("themeBtn").addEventListener("click", ()=>{
  STATE.theme = STATE.theme==="dark" ? "light" : "dark";
  saveState(); applyTheme();
});
document.getElementById("menuToggle").addEventListener("click", ()=>{
  document.getElementById("sidebar").classList.toggle("open");
});
document.addEventListener("keydown", e=>{
  if((e.ctrlKey||e.metaKey) && e.key==="k"){ e.preventDefault(); openSearch(); }
});

renderSidebar();
window.addEventListener("hashchange", router);
router();
</script>
